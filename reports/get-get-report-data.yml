  name: Get report data
  type: http
  seq: 4
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/reports/:id/report'
  auth: inherit
  params:
  - name: id
    value: ''
    type: path
    description: '**Required**. The ID of the desired report.'
  - name: fleet_id
    value: ''
    type: query
    disabled: true
    description: Filter the report to only include hosts that are associated with the fleet specified.
  - name: query
    value: ''
    type: query
    disabled: true
    description: Search query keywords. Matches the host's display name and any result column value.
  - name: page
    value: ''
    type: query
    disabled: true
    description: Page number of the results to fetch. Only applies when `per_page` is set.
  - name: per_page
    value: ''
    type: query
    disabled: true
    description: Results per page. If omitted, all results are returned and `meta` is not included.
  - name: order_key
    value: ''
    type: query
    disabled: true
    description: What to order results by. Valid options are `"last_fetched"`, `"host_name"`, `"host_id"`, or the
      name of a result column. Result column values are sorted as strings, and the built-in options take precedence
      over a result column with the same name. Default is `"last_fetched"`.
  - name: order_direction
    value: ''
    type: query
    disabled: true
    description: '**Requires `order_key`**. The direction of the order given the order key. Options include `"asc"`
      and `"desc"`. Default is `"desc"`.'
docs: |-
  Returns a specific report's data.

  `GET /api/v1/fleet/reports/:id/report`

  #### Parameters

  | Name            | Type    | In    | Description                                                                               |
  | --------------- | ------- | ----- | ----------------------------------------------------------------------------------------- |
  | id              | integer | path  | **Required**. The ID of the desired report.                                               |
  | fleet_id        | integer | query | Filter the report to only include hosts that are associated with the fleet specified.     |
  | query           | string  | query | Search query keywords. Matches the host's display name and any result column value.       |
  | page            | integer | query | Page number of the results to fetch. Only applies when `per_page` is set.                 |
  | per_page        | integer | query | Results per page. If omitted, all results are returned and `meta` is not included.        |
  | order_key       | string  | query | What to order results by. Valid options are `"last_fetched"`, `"host_name"`, `"host_id"`, or the name of a result column. Result column values are sorted as strings, and the built-in options take precedence over a result column with the same name. Default is `"last_fetched"`. |
  | order_direction | string  | query | **Requires `order_key`**. The direction of the order given the order key. Options include `"asc"` and `"desc"`. Default is `"desc"`. |

  #### Example

  `GET /api/v1/fleet/reports/31/report?per_page=5`

  ##### Default response

  `Status: 200`

  ```json
  {
    "query_id": 31,
    "report_id": 31,
    "report_clipped": false,
    "count": 12,
    "meta": {
      "has_next_results": true,
      "has_previous_results": false
    },
    "results": [
      {
        "host_id": 1,
        "host_name": "foo",
        "last_fetched": "2021-01-19T17:08:31Z",
        "columns": {
          "model": "USB 2.0 Hub",
          "vendor": "VIA Labs, Inc."
        }
      },
      {
        "host_id": 1,
        "host_name": "foo",
        "last_fetched": "2021-01-19T17:08:31Z",
        "columns": {
          "model": "USB Keyboard",
          "vendor": "VIA Labs, Inc."
        }
      },
      {
        "host_id": 2,
        "host_name": "bar",
        "last_fetched": "2021-01-19T17:20:00Z",
        "columns": {
          "model": "USB Receiver",
          "vendor": "Logitech"
        }
      },
      {
        "host_id": 2,
        "host_name": "bar",
        "last_fetched": "2021-01-19T17:20:00Z",
        "columns": {
          "model": "USB Receiver",
          "vendor": "Logitech"
        }
      },
      {
        "host_id": 2,
        "host_name": "bar",
        "last_fetched": "2021-01-19T17:20:00Z",
        "columns": {
          "model": "Display Audio",
          "vendor": "Apple Inc."
        }
      }
    ]
  }
  ```

  `count` is the total number of results matching the request across all pages.

  `last_fetched` is when Fleet last received the host's results. If the host's results haven't changed, Fleet updates `last_fetched` about once an hour, so it can trail the host's most recent run by up to an hour.

  If a report has no results stored, then `results` will be an empty array:

  ```json
  {
    "query_id": 32,
    "report_id": 32,
    "report_clipped": false,
    "count": 0,
    "results": []
  }
  ```

  > Scheduled reports do not return errors, so only non-error results are included. If you suspect a report may be running into errors, you can use the [live report](#run-live-report) endpoint to get diagnostics.

  Reference: https://fleetdm.com/docs/rest-api/rest-api#get-report-data
