            "disabled": true
          }
        ],
        "stats": {
          "system_time_p50": 1.32,
          "system_time_p95": 4.02,
          "user_time_p50": 3.55,
          "user_time_p95": 3.00,
          "total_executions": 3920
        }
      },
      {
