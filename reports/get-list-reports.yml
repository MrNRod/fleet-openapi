info:
  name: List reports
  type: http
  seq: 1
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/reports'
  auth: inherit
  params:
  - name: order_key
    value: ''
    type: query
    disabled: true
    description: What to order results by. Can be any column in the reports table.
  - name: order_direction
    value: ''
    type: query
    disabled: true
    description: '**Requires `order_key`**. The direction of the order given the order key. Options include `"asc"`
      and `"desc"`. Default is `"asc"`.'
  - name: fleet_id
    value: ''
    type: query
    disabled: true
    description: _Available in Fleet Premium_. The ID of the fleet for the reports to be listed. When omitted, returns
      global reports.
  - name: query
    value: ''
    type: query
    disabled: true
    description: Search query keywords. Searchable fields include `name`.
  - name: merge_inherited
    value: ''
    type: query
    disabled: true
    description: _Available in Fleet Premium_. If `true`, will include global reports in addition to fleet-level
      reports when filtering by `fleet_id`. (If no `fleet_id` is provided, this parameter is ignored.)
  - name: platform
    value: ''
    type: query
    disabled: true
    description: 'Return reports that are scheduled to run on this platform. One of: `"macos"`, `"windows"`, `"linux"`
      (case-insensitive). (Since reports cannot be scheduled to run on `"chrome"` hosts, it''s not a valid value
      here)'
  - name: page
    value: ''
    type: query
    disabled: true
    description: Page number of the results to fetch.
  - name: per_page
    value: ''
    type: query
    disabled: true
    description: Results per page.
  - name: after
    value: ''
    type: query
    disabled: true
    description: The value to get results after. This needs `order_key` defined, as that's the column that would
      be used.
docs: |-
  Returns a list of reports. To see each report's data, use the [get report data](#get-report-data) endpoint.

  `GET /api/v1/fleet/reports`

  #### Parameters

  | Name            | Type    | In    | Description                                                                                                                   |
  | --------------- | ------- | ----- | ----------------------------------------------------------------------------------------------------------------------------- |
  | order_key       | string  | query | What to order results by. Can be any column in the reports table.                                                             |
  | order_direction | string  | query | **Requires `order_key`**. The direction of the order given the order key. Options include `"asc"` and `"desc"`. Default is `"asc"`. |
  | fleet_id         | integer | query | _Available in Fleet Premium_. The ID of the fleet for the reports to be listed. When omitted, returns global reports.                  |
  | query           | string  | query | Search query keywords. Searchable fields include `name`.                                                                      |
  | merge_inherited | boolean | query | _Available in Fleet Premium_. If `true`, will include global reports in addition to fleet-level reports when filtering by `fleet_id`. (If no `fleet_id` is provided, this parameter is ignored.) |
  | platform        | string  | query | Return reports that are scheduled to run on this platform. One of: `"macos"`, `"windows"`, `"linux"` (case-insensitive). (Since reports cannot be scheduled to run on `"chrome"` hosts, it's not a valid value here) |
  | page                    | integer | query | Page number of the results to fetch. |
  | per_page                | integer | query | Results per page. |
  | after                   | string  | query | The value to get results after. This needs `order_key` defined, as that's the column that would be used. |

  #### Example

  `GET /api/v1/fleet/reports`

  ##### Default response

  `Status: 200`

  ```json
