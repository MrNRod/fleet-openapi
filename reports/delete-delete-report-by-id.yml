    value: ''
    type: path
    description: '**Required.** The ID of the report.'
docs: |-
  Deletes the report specified by ID.

  `DELETE /api/v1/fleet/reports/id/:id`

  #### Parameters

  | Name | Type    | In   | Description                        |
  | ---- | ------- | ---- | ---------------------------------- |
  | id   | integer | path | **Required.** The ID of the report. |

  #### Example

  `DELETE /api/v1/fleet/reports/id/28`

  ##### Default response

  `Status: 200`

  Reference: https://fleetdm.com/docs/rest-api/rest-api#delete-report-by-id
