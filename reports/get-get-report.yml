info:
  name: Get report
  type: http
  seq: 3
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/reports/:id'
  auth: inherit
  params:
  - name: id
    value: ''
    type: path
    description: '**Required**. The id of the desired report.'
docs: |-
  Returns the report specified by ID.

  `GET /api/v1/fleet/reports/:id`

  #### Parameters

  | Name | Type    | In   | Description                                |
  | ---- | ------- | ---- | ------------------------------------------ |
  | id   | integer | path | **Required**. The id of the desired report. |

  #### Example

  `GET /api/v1/fleet/reports/31`

  ##### Default response

  `Status: 200`

  ```json
  {
    "query": {
      "created_at": "2021-01-19T17:08:24Z",
      "updated_at": "2021-01-19T17:08:24Z",
      "id": 31,
      "name": "centos_hosts",
      "description": "",
      "query": "select 1 from os_version where platform = \"centos\";",
      "team_id": null,
      "interval": 3600,
      "platform": "",
      "min_osquery_version": "",
      "automations_enabled": true,
      "logging": "snapshot",
      "saved": true,
      "observer_can_run": true,
      "discard_data": false,
      "author_id": 1,
      "author_name": "John",
      "author_email": "john@example.com",
      "labels_include_any": [],
      "packs": [
        {
          "created_at": "2021-01-19T17:08:31Z",
          "updated_at": "2021-01-19T17:08:31Z",
          "id": 14,
          "name": "test_pack",
          "description": "",
          "platform": "",
          "disabled": false
        }
      ],
      "stats": {
        "system_time_p50": 1.32,
        "system_time_p95": 4.02,
        "user_time_p50": 3.55,
        "user_time_p95": 3.00,
        "total_executions": 3920
      }
    }
  }
  ```

  Reference: https://fleetdm.com/docs/rest-api/rest-api#get-report
