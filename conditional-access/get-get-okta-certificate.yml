info:
  name: Get Okta certificate
  type: http
  seq: 1
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/conditional_access/idp/signing_cert'
  auth: inherit
docs: |-
  Download the SAML IdP signing certificate for Okta conditional access. Okta uses this certificate to verify SAML assertions signed by Fleet.

  `GET /api/v1/fleet/conditional_access/idp/signing_cert`

  #### Parameters

  None.

  #### Example

  `GET /api/v1/fleet/conditional_access/idp/signing_cert`

  ##### Default response

  `Status: 200`

  Returns a PEM-encoded X.509 certificate file with `Content-Type: application/x-pem-file`.

  Reference: https://fleetdm.com/docs/rest-api/rest-api#get-okta-certificate
examples:
- name: 200 Default response
  request:
    method: GET
    url: '{{baseUrl}}/api/v1/fleet/conditional_access/idp/signing_cert'
  response:
    status: 200
    statusText: OK
