info:
  name: Get database information
  type: http
  seq: 2
http:
  method: GET
  url: '{{baseUrl}}/debug/db/:key'
  auth: inherit
  params:
  - name: key
    value: ''
    type: path
docs: |-
  Returns information about the current state of the database; valid keys are:

  - `locks`: returns transaction locking information.
  - `innodb-status`: returns InnoDB status information.
  - `process-list`: returns running processes (queries, etc).

  `GET /debug/db/:key`

  #### Parameters

  None.

  #### Example

  `GET /debug/db/process-list`

  ##### Default response

  `Status: 200`

  ```json
  [
    {
      "id": 1234,
      "user": "fleet",
      "host": "10.0.0.5:52014",
      "db": "fleet",
      "command": "Query",
      "time": 0,
      "state": "executing",
      "info": "SELECT * FROM hosts"
    }
  ]
  ```

  > The response shape depends on the requested `key`. `locks` returns a list of objects with `waiting_trx_id`, `waiting_thread`, `waiting_query`, `blocking_trx_id`, `blocking_thread`, and `blocking_query`. `innodb-status` returns a JSON string containing the raw `SHOW ENGINE INNODB STATUS` output. `process-list` returns a list of objects as shown above.

  Reference: https://fleetdm.com/docs/rest-api/rest-api#get-database-information
examples:
- name: 200 Default response
  request:
    method: GET
    url: '{{baseUrl}}/debug/db/:key'
    params:
    - name: key
      value: ''
      type: path
  response:
    status: 200
    statusText: OK
    body:
      type: json
      data: |-
        [
          {
            "id": 1234,
            "user": "fleet",
            "host": "10.0.0.5:52014",
            "db": "fleet",
            "command": "Query",
            "time": 0,
            "state": "executing",
            "info": "SELECT * FROM hosts"
          }
        ]
    headers:
    - name: Content-Type
      value: application/json
