http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/labels'
  auth: inherit
  params:
  - name: include_host_counts
    value: ''
    type: query
    disabled: true
    description: Whether or not to calculate host counts for each label. Default is `true`. See "additional notes"
      for more information.
  - name: order_key
    value: ''
    type: query
    disabled: true
    description: What to order results by. Can be any column in the labels table.
  - name: order_direction
    value: ''
    type: query
    disabled: true
    description: '**Requires `order_key`**. The direction of the order given the order key. Options include `"asc"`
      and `"desc"`. Default is `"asc"`.'
  - name: after
    value: ''
    type: query
    disabled: true
    description: The value to get results after. This needs `order_key` defined, as that's the column that would
      be used.
  - name: fleet_id
    value: ''
    type: query
    disabled: true
    description: _Available in Fleet Premium._  Filters to labels belonging to the specified fleet, plus global
      labels. Specify `"global"` to show only globally-available labels. If omitted, Fleet returns all global labels,
      plus all labels for fleets to which the requestor has access.
docs: |-
  Returns a list of labels.

  `GET /api/v1/fleet/labels`

  #### Parameters

  | Name            | Type    | In    | Description   |
  | --------------- | ------- | ----- |------------------------------------- |
  | include_host_counts | boolean | query | Whether or not to calculate host counts for each label. Default is `true`. See "additional notes" for more information. |
  | order_key       | string  | query | What to order results by. Can be any column in the labels table.                                                  |
  | order_direction | string  | query | **Requires `order_key`**. The direction of the order given the order key. Options include `"asc"` and `"desc"`. Default is `"asc"`. |
  | after           | string  | query | The value to get results after. This needs `order_key` defined, as that's the column that would be used. |
  | fleet_id         | string | query | _Available in Fleet Premium._  Filters to labels belonging to the specified fleet, plus global labels. Specify `"global"` to show only globally-available labels. If omitted, Fleet returns all global labels, plus all labels for fleets to which the requestor has access. |

  When `include_host_counts` is `true` (or omitted), `host_count` will only be included for `labels` that are in use by one or more hosts, but `count` will always be included, even if it is `0`. When `include_host_counts` is `false`, `host_count` will always be omitted, and `count` will be returned as `0` for each label. Setting `include_host_counts=false` will improve API performance, especially on deployments with large numbers of hosts and labels.

  #### Example

  `GET /api/v1/fleet/labels`

  ##### Default response

  `Status: 200`

  ```json
  {
    "labels": [
      {
        "created_at": "2021-02-02T23:55:25Z",
        "updated_at": "2021-02-02T23:55:25Z",
        "id": 6,
        "name": "All Hosts",
        "description": "All hosts which have enrolled in Fleet",
        "query": "SELECT 1;",
        "label_type": "builtin",
        "label_membership_type": "dynamic",
        "host_count": 7,
        "display_text": "All Hosts",
        "count": 7,
        "host_ids": null,
        "author_id": 1,
        "team_id": null,
        "fleet_id": null
      },
      {
        "created_at": "2021-02-02T23:55:25Z",
        "updated_at": "2021-02-02T23:55:25Z",
        "id": 7,
        "name": "macOS",
        "description": "All macOS hosts",
        "query": "SELECT 1 FROM os_version WHERE platform = 'darwin';",
        "platform": "darwin",
        "label_type": "builtin",
        "label_membership_type": "dynamic",
        "host_count": 1,
        "display_text": "macOS",
        "count": 1,
        "host_ids": null,
        "author_id": 1,
        "team_id": null,
        "fleet_id": null
      },
      {
        "created_at": "2021-02-02T23:55:25Z",
        "updated_at": "2021-02-02T23:55:25Z",
        "id": 8,
        "name": "Ubuntu Linux",
        "description": "All Ubuntu hosts",
        "query": "SELECT 1 FROM os_version WHERE platform = 'ubuntu' OR platform_like LIKE '%ubuntu%';",
        "platform": "ubuntu",
