        "id": 9,
        "name": "CentOS Linux",
        "description": "All CentOS hosts",
        "query": "SELECT 1 FROM os_version WHERE platform = 'centos' OR name LIKE '%centos%'",
        "label_type": "builtin",
        "label_membership_type": "dynamic",
        "host_count": 3,
        "display_text": "CentOS Linux",
        "count": 3,
        "host_ids": null,
