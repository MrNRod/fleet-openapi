info:
  name: Get label
  type: http
  seq: 3
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/labels/:id'
  auth: inherit
  params:
  - name: id
    value: ''
    type: path
    description: '**Required**. The label''s id.'
docs: |-
  Returns the specified label.

  `GET /api/v1/fleet/labels/:id`

  #### Parameters

  | Name | Type    | In   | Description                   |
  | ---- | ------- | ---- | ----------------------------- |
  | id   | integer | path | **Required**. The label's id. |

  #### Example

  `GET /api/v1/fleet/labels/1`

  ##### Default response

  `Status: 200`

  ```json
  {
    "label": {
      "created_at": "2021-02-09T22:09:43Z",
      "updated_at": "2021-02-09T22:15:58Z",
      "id": 12,
      "name": "Ubuntu",
      "description": "Filters ubuntu hosts",
      "query": "SELECT 1 FROM os_version WHERE platform = 'ubuntu';",
      "label_type": "regular",
      "label_membership_type": "dynamic",
      "display_text": "Ubuntu",
      "count": 0,
      "host_ids": null,
      "author_id": 1,
      "team_id": null,
      "fleet_id": null,
      "team_name": null,
      "fleet_name": null
    }
  }
  ```

  Reference: https://fleetdm.com/docs/rest-api/rest-api#get-label
