info:
  name: Get EULA metadata
  type: http
  seq: 14
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/setup_experience/eula/metadata'
  auth: inherit
docs: |-
  _Available in Fleet Premium_

  Get information about the EULA file that was uploaded to Fleet. If no EULA was previously uploaded, this endpoint returns a `404` status code.

  `GET /api/v1/fleet/setup_experience/eula/metadata`

  #### Example

  `GET /api/v1/fleet/setup_experience/eula/metadata`

  ##### Default response

  `Status: 200`

  ```json
  {
    "name": "eula.pdf",
    "token": "AA598E2A-7952-46E3-B89D-526D45F7E233",
    "created_at": "2023-04-20T13:02:05Z"
  }
  ```

  In the response above:

  - `token` is the value you can use to [download an EULA](#download-an-eula-file)

  Reference: https://fleetdm.com/docs/rest-api/rest-api#get-eula-metadata
examples:
- name: 200 Default response
  request:
    method: GET
    url: '{{baseUrl}}/api/v1/fleet/setup_experience/eula/metadata'
  response:
    status: 200
    statusText: OK
    body:
      type: json
      data: |-
        {
          "name": "eula.pdf",
          "token": "AA598E2A-7952-46E3-B89D-526D45F7E233",
          "created_at": "2023-04-20T13:02:05Z"
        }
    headers:
    - name: Content-Type
      value: application/json
