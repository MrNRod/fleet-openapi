info:
  name: List setup experience software
  type: http
  seq: 17
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/setup_experience/software'
  auth: inherit
  params:
  - name: platform
    value: ''
    type: query
    disabled: true
    description: Filters software titles available for install by platforms. Options are `"macos"`, `"windows"`,
      `"linux"`, `"ios"`, `"ipados"`, and `"android"`. Defaults to `"macos"`. To show titles from multiple platforms,
      separate the platforms with commas (e.g. `?platform=macos,ios,android`).
  - name: fleet_id
    value: ''
    type: query
    disabled: true
    description: _Available in Fleet Premium_. The ID of the fleet to filter software by. If not specified, it will
      filter only software that's available for "Unassigned" hosts.
  - name: page
    value: ''
    type: query
    disabled: true
    description: Page number of the results to fetch.
  - name: per_page
    value: ''
    type: query
    disabled: true
    description: Results per page.
  - name: order_key
    value: ''
    type: query
    disabled: true
    description: What to order results by. Allowed fields are `name` and `hosts_count`. Default is `hosts_count`
      (descending).
  - name: order_direction
    value: ''
    type: query
    disabled: true
    description: '**Requires `order_key`**. The direction of the order given the order key. Options include `"asc"`
      and `"desc"`. Default is `"asc"`.'
docs: |-
  _Available in Fleet Premium_


  List software that can be automatically installed during setup. If `install_during_setup` is `true` it will be installed during setup. On Windows and Linux hosts, Fleet checks the software's associated policies first and skips the install when the host passes all of them. Learn more in the [Windows and Linux setup experience guide](https://fleetdm.com/guides/windows-linux-setup-experience#policies-are-checked-before-install).

  `GET /api/v1/fleet/setup_experience/software`

  #### Parameters

  | Name  | Type   | In    | Description                              |
  | ----- | ------ | ----- | ---------------------------------------- |
  | platform | string  | query | Filters software titles available for install by platforms. Options are `"macos"`, `"windows"`, `"linux"`, `"ios"`, `"ipados"`, and `"android"`. Defaults to `"macos"`. To show titles from multiple platforms, separate the platforms with commas (e.g. `?platform=macos,ios,android`). |
  | fleet_id | integer | query | _Available in Fleet Premium_. The ID of the fleet to filter software by. If not specified, it will filter only software that's available for "Unassigned" hosts. |
  | page | integer | query | Page number of the results to fetch. |
  | per_page | integer | query | Results per page. |
  | order_key | string | query | What to order results by. Allowed fields are `name` and `hosts_count`. Default is `hosts_count` (descending). |
  | order_direction | string | query | **Requires `order_key`**. The direction of the order given the order key. Options include `"asc"` and `"desc"`. Default is `"asc"`. |


  #### Example

  `GET /api/v1/fleet/setup_experience/software?fleet_id=3`

  ##### Default response

  `Status: 200`

  ```json
  {
    "software_titles": [
      {
        "id": 12,
        "name": "Firefox.app",
        "icon_url": "/api/latest/fleet/software/titles/12/icon?fleet_id=3",
        "software_package": {
          "name": "FirefoxInstall.pkg",
          "platform": "darwin",
          "version": "125.6",
          "self_service": true,
          "install_during_setup": true
        },
        "app_store_app": null,
        "versions_count": 3,
        "source": "apps",
        "hosts_count": 48,
        "versions": [
          {
            "id": 123,
            "version": "1.12",
            "vulnerabilities": ["CVE-2023-1234","CVE-2023-4321","CVE-2023-7654"]
          },
          {
            "id": 124,
            "version": "3.4",
            "vulnerabilities": ["CVE-2023-1234","CVE-2023-4321","CVE-2023-7654"]
          },
          {
            "id": 12,
            "version": "1.13",
            "vulnerabilities": ["CVE-2023-1234","CVE-2023-4321","CVE-2023-7654"]
          }
        ]
      }
    ],
    "count": 2,
    "counts_updated_at": "2024-10-04T10:00:00Z",
    "meta": {
      "has_next_results": false,
      "has_previous_results": false
    }
  }
  ```

  Reference: https://fleetdm.com/docs/rest-api/rest-api#list-setup-experience-software
