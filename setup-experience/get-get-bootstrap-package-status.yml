docs: |-
  _Available in Fleet Premium_

  Get aggregate status counts of bootstrap packages delivered to DEP enrolled hosts.

  The summary can optionally be filtered by fleet ID.

  `GET /api/v1/fleet/bootstrap/summary`

  #### Parameters

  | Name                      | Type   | In    | Description                                                               |
  | ------------------------- | ------ | ----- | ------------------------------------------------------------------------- |
  | fleet_id                   | string | query | The fleet ID to filter the summary.                                        |

  #### Example

  `GET /api/v1/fleet/bootstrap/summary`

  ##### Default response

  `Status: 200`

  ```json
  {
    "installed": 10,
    "failed": 1,
    "pending": 4
  }
  ```

  Reference: https://fleetdm.com/docs/rest-api/rest-api#get-bootstrap-package-status
examples:
- name: 200 Default response
  request:
    method: GET
    url: '{{baseUrl}}/api/v1/fleet/bootstrap/summary'
    params:
    - name: fleet_id
      value: ''
      type: query
      disabled: true
      description: The fleet ID to filter the summary.
  response:
    status: 200
    statusText: OK
    body:
      type: json
      data: |-
        {
          "installed": 10,
          "failed": 1,
          "pending": 4
        }
    headers:
    - name: Content-Type
      value: application/json
