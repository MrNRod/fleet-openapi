info:
  name: Get or download setup experience script
  type: http
  seq: 20
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/setup_experience/script'
  auth: inherit
  params:
  - name: fleet_id
    value: ''
    type: query
    disabled: true
    description: _Available in Fleet Premium_. The ID of the fleet to get the script for. If not specified, script
      will be returned for "Unassigned" hosts.
  - name: alt
    value: ''
    type: query
    disabled: true
    description: If specified and set to "media", downloads the script's contents.
docs: |-
  _Available in Fleet Premium_

  Get a script that will automatically run during macOS setup.

  `GET /api/v1/fleet/setup_experience/script`

  | Name  | Type   | In    | Description                              |
  | ----- | ------ | ----- | ---------------------------------------- |
  | fleet_id | integer | query | _Available in Fleet Premium_. The ID of the fleet to get the script for. If not specified, script will be returned for "Unassigned" hosts. |
  | alt  | string | query | If specified and set to "media", downloads the script's contents. |


  #### Example (get script)

  `GET /api/v1/fleet/setup_experience/script?fleet_id=3`

  ##### Default response

  `Status: 200`

  ```json
  {
    "id": 1,
    "team_id": 3,
    "fleet_id": 3,
    "name": "setup-experience-script.sh",
    "created_at": "2023-07-30T13:41:07Z",
    "updated_at": "2023-07-30T13:41:07Z"
  }
  ```

  #### Example (download script)

  `GET /api/v1/fleet/setup_experience/script?fleet_id=3&alt=media`

  ##### Example response headers

  ```http
  Content-Length: 13
  Content-Type: application/octet-stream
  Content-Disposition: attachment;filename="2023-09-27 script_1.sh"
  ```

  ###### Example response body

  `Status: 200`

  ```
  echo "hello"
  ```

  Reference: https://fleetdm.com/docs/rest-api/rest-api#get-or-download-setup-experience-script
