docs: |-
  `POST /api/v1/fleet/global/policies/delete`

  #### Parameters

  | Name     | Type    | In   | Description                                       |
  | -------- | ------- | ---- | ------------------------------------------------- |
  | ids      | array   | body | **Required.** The IDs of the policies to delete.  |

  #### Example

  `POST /api/v1/fleet/global/policies/delete`

  #### Request body

  ```json
  {
    "ids": [ 1 ]
  }
  ```

  ##### Default response

  `Status: 200`

  ```json
  {
    "deleted": 1
  }
  ```

  ---

  Reference: https://fleetdm.com/docs/rest-api/rest-api#delete-policies
