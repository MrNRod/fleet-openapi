http:
  method: PUT
  url: '{{baseUrl}}/api/v1/fleet/software/titles/:id/icon'
  auth: inherit
  params:
  - name: id
    value: ''
    type: path
    description: ID of the software title being updated.
  - name: fleet_id
    value: ''
    type: query
    disabled: true
    description: '**Required**. The fleet ID. Updates a software icon in the specified fleet.'
  body:
    type: multipart-form
    data:
    - name: icon
      value: []
      description: Must be PNG format. It must be square with dimensions between 120x120 px and 1024x1024 px.
      disabled: true
      type: file
    - name: hash_sha256
