info:
  name: Download software
  type: http
  seq: 19
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/software/titles/:id/package'
  auth: inherit
  params:
  - name: id
    value: ''
    type: path
    description: '**Required**. The ID of the software title to download software package.'
  - name: fleet_id
    value: ''
    type: query
    disabled: true
    description: '**Required**. The fleet ID. Downloads a software package added to the specified fleet.'
  - name: alt
    value: ''
    type: query
    disabled: true
    description: '**Required**. If specified and set to `"media"`, downloads the specified software package.'
docs: |-
  _Available in Fleet Premium._

  `GET /api/v1/fleet/software/titles/:id/package?alt=media`

  #### Parameters

  | Name            | Type    | In   | Description                                      |
  | ----            | ------- | ---- | --------------------------------------------     |
  | id   | integer | path | **Required**. The ID of the software title to download software package.|
  | fleet_id | integer | query | **Required**. The fleet ID. Downloads a software package added to the specified fleet. |
  | alt             | string | query | **Required**. If specified and set to `"media"`, downloads the specified software package. |

  #### Example

  `GET /api/v1/fleet/software/titles/123/package?alt=media&fleet_id=2`

  ##### Default response

  `Status: 200`

  ```http
  Status: 200
  Content-Type: application/octet-stream
  Content-Disposition: attachment
  Content-Length: <length>
  Body: <blob>
  ```

  Reference: https://fleetdm.com/docs/rest-api/rest-api#download-software
