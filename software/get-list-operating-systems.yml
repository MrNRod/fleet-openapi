info:
  name: List operating systems
  type: http
  seq: 3
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/os_versions'
  auth: inherit
  params:
  - name: fleet_id
    value: ''
    type: query
    disabled: true
    description: _Available in Fleet Premium_. Filters response data to the specified fleet. Use `0` to filter by
      "Unassigned" hosts.
  - name: platform
    value: ''
    type: query
    disabled: true
    description: 'Filters the hosts to the specified platform. One of: `"darwin"` (macOS), `"windows"`, `"linux"`,
      `"chrome"`, `"ios"`, `"ipados"`,` or `"android"`.'
  - name: os_name
    value: ''
    type: query
    disabled: true
    description: The name of the operating system to filter hosts by. `os_version` must also be specified with `os_name`
  - name: os_version
    value: ''
    type: query
    disabled: true
    description: The version of the operating system to filter hosts by. `os_name` must also be specified with `os_version`
  - name: max_vulnerabilities
    value: ''
    type: query
    disabled: true
    description: Limits the number of `vulnerabilities` returned per OS version. (If omitted, returns all vulnerabilities.)
  - name: page
    value: ''
    type: query
    disabled: true
    description: Page number of the results to fetch.
  - name: per_page
    value: ''
    type: query
    disabled: true
    description: Results per page. Default is `20`.
  - name: order_key
    value: ''
    type: query
    disabled: true
    description: 'What to order results by. Allowed fields are: `hosts_count`. Default is `hosts_count` (descending).'
  - name: order_direction
    value: ''
    type: query
    disabled: true
    description: '**Requires `order_key`**. The direction of the order given the order key. Options include `"asc"`
      and `"desc"`. Default is `"asc"`.'
docs: |-
  Returns a list of all operating systems.

  `GET /api/v1/fleet/os_versions`

  #### Parameters

  | Name                | Type     | In    | Description                                                                                                                          |
  | ---      | ---      | ---   | ---                                                                                                                                  |
  | fleet_id             | integer | query | _Available in Fleet Premium_. Filters response data to the specified fleet. Use `0` to filter by "Unassigned" hosts.  |
  | platform            | string   | query | Filters the hosts to the specified platform. One of: `"darwin"` (macOS), `"windows"`, `"linux"`, `"chrome"`, `"ios"`, `"ipados"`,` or `"android"`. |
  | os_name     | string | query | The name of the operating system to filter hosts by. `os_version` must also be specified with `os_name`                                                 |
  | os_version    | string | query | The version of the operating system to filter hosts by. `os_name` must also be specified with `os_version`                                                 |
  | max_vulnerabilities   | integer | query | Limits the number of `vulnerabilities` returned per OS version. (If omitted, returns all vulnerabilities.) |
  | page                    | integer | query | Page number of the results to fetch.                                                                                                                                       |
  | per_page                | integer | query | Results per page. Default is `20`. |
  | order_key               | string  | query | What to order results by. Allowed fields are: `hosts_count`. Default is `hosts_count` (descending).      |
  | order_direction | string | query | **Requires `order_key`**. The direction of the order given the order key. Options include `"asc"` and `"desc"`. Default is `"asc"`. |


  ##### Default response

  `Status: 200`

  ```json
  {
    "count": 1,
    "counts_updated_at": "2023-12-06T22:17:30Z",
    "os_versions": [
      {
        "os_version_id": 123,
        "hosts_count": 21,
        "name": "Microsoft Windows 11 Pro 23H2 10.0.22621.1234",
        "name_only": "Microsoft Windows 11 Pro 23H2",
        "version": "10.0.22621.1234",
        "platform": "windows",
        "generated_cpes": [],
        "vulnerabilities_count": 1,
        "vulnerabilities": [
          {
            "cve": "CVE-2022-30190",
            "details_link": "https://nvd.nist.gov/vuln/detail/CVE-2022-30190",
            "cvss_score": 7.8,// Available in Fleet Premium
            "epss_probability": 0.9729,// Available in Fleet Premium
            "cisa_known_exploit": false,// Available in Fleet Premium
            "cve_published": "2022-06-01T00:15:00Z",// Available in Fleet Premium
            "cve_description": "Microsoft Windows Support Diagnostic Tool (MSDT) Remote Code Execution Vulnerability.",// Available in Fleet Premium
            "resolved_in_version": ""// Available in Fleet Premium
          }
        ]
      }
    ],
    "meta": {
      "has_next_results": false,
      "has_previous_results": false
    }
  }
  ```

  Windows and macOS listed vulnerabilities are based on OS version-specific data. Linux vulnerabilities are based on kernel vulnerabilities for hosts running the specified OS version. Both active and inactive kernels on a host are accounted for in kernel vulnerability reporting. Other operating systems do not report vulnerabilities.

  Reference: https://fleetdm.com/docs/rest-api/rest-api#list-operating-systems
