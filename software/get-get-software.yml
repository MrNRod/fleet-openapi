info:
  name: Get software
  type: http
  seq: 4
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/software/titles/:id'
  auth: inherit
  params:
  - name: id
    value: ''
    type: path
    description: '**Required.** The software title''s ID.'
  - name: fleet_id
    value: ''
    type: query
    disabled: true
    description: _Available in Fleet Premium_. Filters response data to the specified fleet. Use `0` to filter by
      "Unassigned" hosts.
docs: |-
  Returns information about the specified software. By default, `versions` are sorted in descending order by the `hosts_count` field.

  `GET /api/v1/fleet/software/titles/:id`

  #### Parameters

  | Name | Type | In | Description |
  | ---- | ---- | -- | ----------- |
  | id   | integer | path | **Required.** The software title's ID. |
  | fleet_id             | integer | query | _Available in Fleet Premium_. Filters response data to the specified fleet. Use `0` to filter by "Unassigned" hosts.  |

  #### Example

  `GET /api/v1/fleet/software/titles/2792?fleet_id=3`

  ##### Default response

  `Status: 200`

  ```json
  {
    "software_title": {
