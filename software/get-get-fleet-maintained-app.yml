info:
  name: Get Fleet-maintained app
  type: http
  seq: 16
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/software/fleet_maintained_apps/:id'
  auth: inherit
  params:
  - name: id
    value: ''
    type: path
    description: '**Required.** The Fleet-maintained app''s ID.'
  - name: fleet_id
    value: ''
    type: query
    disabled: true
    description: If supplied, set `software_title_id` on the response when an installer or VPP app has already been
      added to that fleet for that software.
docs: |-
  Returns information about the specified Fleet-maintained app.

  `GET /api/v1/fleet/software/fleet_maintained_apps/:id`

  #### Parameters

  | Name | Type | In | Description |
  | ---- | ---- | -- | ----------- |
  | id   | integer | path | **Required.** The Fleet-maintained app's ID. |
  | fleet_id  | integer | query | If supplied, set `software_title_id` on the response when an installer or VPP app has already been added to that fleet for that software.  |

  #### Example

  `GET /api/v1/fleet/software/fleet_maintained_apps/1`

  ##### Default response

  `Status: 200`

  ```json
  {
    "fleet_maintained_app": {
      "id": 1,
      "slug": "1password/darwin",
      "name": "1Password",
      "version": "8.10.50",
      "platform": "darwin",
      "url": "https://downloads.1password.com/mac/1Password-8.10.50-aarch64.zip",
      "install_script": "#!/bin/sh\ninstaller -pkg \"$INSTALLER_PATH\" -target /",
      "uninstall_script": "#!/bin/sh\npkg_ids=$PACKAGE_ID\nfor pkg_id in '${pkg_ids[@]}'...",
      "software_title_id": 3,
      "automatic_install_query": "SELECT 1 FROM apps WHERE bundle_identifier = 'com.1password.1password';",
      "categories": ["Productivity"]
    }
  }
  ```

  Reference: https://fleetdm.com/docs/rest-api/rest-api#get-fleet-maintained-app
examples:
- name: 200 Default response
  request:
    method: GET
    url: '{{baseUrl}}/api/v1/fleet/software/fleet_maintained_apps/:id'
    params:
    - name: id
      value: ''
      type: path
      description: '**Required.** The Fleet-maintained app''s ID.'
    - name: fleet_id
      value: ''
      type: query
      disabled: true
      description: If supplied, set `software_title_id` on the response when an installer or VPP app has already
        been added to that fleet for that software.
  response:
    status: 200
    statusText: OK
    body:
      type: json
      data: |-
        {
          "fleet_maintained_app": {
            "id": 1,
            "slug": "1password/darwin",
            "name": "1Password",
            "version": "8.10.50",
            "platform": "darwin",
            "url": "https://downloads.1password.com/mac/1Password-8.10.50-aarch64.zip",
            "install_script": "#!/bin/sh\ninstaller -pkg \"$INSTALLER_PATH\" -target /",
            "uninstall_script": "#!/bin/sh\npkg_ids=$PACKAGE_ID\nfor pkg_id in '${pkg_ids[@]}'...",
            "software_title_id": 3,
            "automatic_install_query": "SELECT 1 FROM apps WHERE bundle_identifier = 'com.1password.1password';",
            "categories": [
              "Productivity"
            ]
          }
        }
    headers:
    - name: Content-Type
      value: application/json
