info:
  name: Update user
  type: http
  seq: 5
http:
  method: PATCH
  url: '{{baseUrl}}/api/v1/fleet/users/:id'
  auth: inherit
  params:
  - name: id
    value: ''
    type: path
    description: '**Required**. The user''s id.'
  body:
    type: json
    data: |-
      {
        "name": "Jane Doe",
        "global_role": "admin"
      }
  headers:
  - name: Content-Type
    value: application/json
docs: |-
  `PATCH /api/v1/fleet/users/:id`

  #### Parameters

  | Name        | Type    | In   | Description                                                                                                                                                                                                                                                                                                                                              |
  | ----------- | ------- | ---- | -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | id          | integer | path | **Required**. The user's id.                                                                                                                                                                                                                                                                                                                             |
  | name        | string  | body | The user's name.                                                                                                                                                                                                                                                                                                                                         |
  | position    | string  | body | The user's position.                                                                                                                                                                                                                                                                                                                                     |
  | email       | string  | body | The user's email.                                                                                                                                                                                                                                                                                                                                        |
  | sso_enabled | boolean | body | Whether or not SSO is enabled for the user.                                                                                                                                                                                                                                                                                                              |
  | mfa_enabled | boolean | body | _Available in Fleet Premium._ Whether or not the user must click a magic link emailed to them to log in, after they successfully enter their username and password. Incompatible with SSO and API-only users. |
  | api_only    | boolean | body | User is an "API-only" user (cannot use web UI) if true.                                                                                                                                                                                                                                                                                                  |
  | password    | string  | body | The user's current password, required to change the user's own email or password (not required for an admin to modify another user).                                                                                                                                                                                                                     |
  | new_password| string  | body | The user's new password. |
  | global_role | string  | body | The role assigned to the user. If `global_role` is specified, `fleets` cannot be specified.                                                                                                                                                                         |
  | fleets       | array   | body | _Available in Fleet Premium_. The fleets and respective roles assigned to the user. Should contain an array of objects in which each object includes the fleet's `id` and the user's `role` on each fleet. In Fleet 4.0.0, 3 user roles were introduced (`admin`, `maintainer`, and `observer`). If `fleets` is specified, `global_role` cannot be specified. |

  #### Example

  `PATCH /api/v1/fleet/users/2`

  ##### Request body

  ```json
  {
    "name": "Jane Doe",
    "global_role": "admin"
  }
  ```

  ##### Default response

  `Status: 200`

  ```json
  {
    "user": {
      "created_at": "2021-02-03T16:11:06Z",
      "updated_at": "2021-02-03T16:11:06Z",
      "id": 2,
      "name": "Jane Doe",
      "email": "janedoe@example.com",
      "global_role": "admin",
      "force_password_reset": false,
      "gravatar_url": "",
      "sso_enabled": false,
      "mfa_enabled": false,
      "api_only": false,
      "fleets": []
    }
  }
  ```

  #### Example (modify a user's fleets)

  `PATCH /api/v1/fleet/users/2`

  ##### Request body

  ```json
  {
    "fleets": [
      {
        "id": 1,
        "role": "observer"
      },
      {
        "id": 2,
        "role": "maintainer"
      }
    ]
  }
  ```

  ##### Default response

  `Status: 200`

  ```json
  {
    "user": {
      "created_at": "2021-02-03T16:11:06Z",
      "updated_at": "2021-02-03T16:11:06Z",
      "id": 2,
      "name": "Jane Doe",
      "email": "janedoe@example.com",
      "enabled": true,
      "force_password_reset": false,
      "gravatar_url": "",
      "sso_enabled": false,
      "mfa_enabled": false,
      "global_role": "admin",
      "fleets": [
        {
          "id": 2,
          "role": "observer"
        },
        {
          "id": 3,
          "role": "maintainer"
        }
      ]
    }
  }
  ```

  Reference: https://fleetdm.com/docs/rest-api/rest-api#update-user
