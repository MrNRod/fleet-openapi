info:
  name: Require password reset
  type: http
  seq: 7
http:
  method: POST
  url: '{{baseUrl}}/api/v1/fleet/users/:id/require_password_reset'
  auth: inherit
  params:
  - name: id
    value: ''
    type: path
    description: '**Required**. The user''s id.'
  body:
    type: json
    data: |-
      {
        "require": true
      }
  headers:
  - name: Content-Type
    value: application/json
docs: |-
  The selected user is logged out of Fleet and required to reset their password during the next attempt to log in. This also revokes all active Fleet API tokens for this user. Returns the user object.

  `POST /api/v1/fleet/users/:id/require_password_reset`

  #### Parameters

  | Name  | Type    | In   | Description                                                                                    |
  | ----- | ------- | ---- | ---------------------------------------------------------------------------------------------- |
  | id    | integer | path | **Required**. The user's id.                                                                   |
  | require | boolean | body | Whether or not the user is required to reset their password during the next attempt to log in. |

  #### Example

  `POST /api/v1/fleet/users/123/require_password_reset`

  ##### Request body

  ```json
  {
    "require": true
  }
  ```

  ##### Default response

  `Status: 200`

  ```json
  {
    "user": {
      "created_at": "2021-02-23T22:23:34Z",
      "updated_at": "2021-02-23T22:28:52Z",
      "id": 2,
      "name": "Jane Doe",
      "email": "janedoe@example.com",
      "force_password_reset": true,
      "gravatar_url": "",
      "mfa_enabled": false,
      "sso_enabled": false,
      "global_role": "observer",
      "fleets": []
    }
  }
  ```

  Reference: https://fleetdm.com/docs/rest-api/rest-api#require-password-reset
