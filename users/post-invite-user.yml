info:
  name: Invite user
  type: http
  seq: 10
http:
  method: POST
  url: '{{baseUrl}}/api/v1/fleet/invites'
  auth: inherit
  body:
    type: json
    data: |-
      {
        "email": "john_appleseed@example.com",
        "name": "John",
        "sso_enabled": false,
        "mfa_enabled": false,
        "global_role": null,
        "fleets": [
          {
            "id": 2,
            "role": "observer"
          },
          {
            "id": 3,
            "role": "maintainer"
          }
        ]
      }
  headers:
  - name: Content-Type
    value: application/json
docs: |-
  `POST /api/v1/fleet/invites`

  #### Parameters

  | Name        | Type    | In   | Description                                                                                                                                           |
  | ----------- | ------- | ---- | ----------------------------------------------------------------------------------------------------------------------------------------------------- |
  | global_role | string  | body | Role the user will be granted. Either a global role is needed, or a fleet role.                                                                        |
  | email       | string  | body | **Required.** The email of the invited user. This email will receive the invitation link.                                                             |
  | name        | string  | body | **Required.** The name of the invited user.                                                                                                           |
  | sso_enabled | boolean | body | **Required.** Whether or not SSO will be enabled for the invited user.                                                                                |
  | mfa_enabled | boolean | body | _Available in Fleet Premium._ Whether or not the invited user must click a magic link emailed to them to log in, after they successfully enter their username and password. Users can have SSO or MFA enabled, but not both. |
  | fleets       | array   | body | _Available in Fleet Premium_. A list of the fleets the user is a member of. Each item includes the fleet's ID and the user's role in the specified fleet. |

  #### Example

  `POST /api/v1/fleet/invites`

  ##### Request body

  ```json
  {
    "email": "john_appleseed@example.com",
    "name": "John",
    "sso_enabled": false,
    "mfa_enabled": false,
    "global_role": null,
    "fleets": [
      {
        "id": 2,
        "role": "observer"
      },
      {
        "id": 3,
        "role": "maintainer"
      }
    ]
  }
  ```

  ##### Default response

  `Status: 200`

  ```json
  {
    "invite": {
      "created_at": "0001-01-01T00:00:00Z",
      "updated_at": "0001-01-01T00:00:00Z",
      "id": 3,
      "invited_by": 1,
      "email": "john_appleseed@example.com",
      "name": "John",
      "sso_enabled": false,
      "mfa_enabled": false,
      "fleets": [
        {
          "id": 10,
          "created_at": "0001-01-01T00:00:00Z",
          "name": "Apples",
          "description": "",
          "agent_options": null,
          "user_count": 0,
          "host_count": 0,
          "role": "observer"
        },
        {
          "id": 14,
          "created_at": "0001-01-01T00:00:00Z",
          "name": "Best of the Best Engineering",
          "description": "",
          "agent_options": null,
          "user_count": 0,
          "host_count": 0,
          "role": "maintainer"
        }
      ]
    }
  }
  ```

  Reference: https://fleetdm.com/docs/rest-api/rest-api#invite-user
