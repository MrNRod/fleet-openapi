info:
  name: Create API-only user
  type: http
  seq: 15
http:
  method: POST
  url: '{{baseUrl}}/api/v1/fleet/users/api_only'
  auth: inherit
  body:
    type: json
    data: |-
      {
        "name": "Jane Doe",
        "fleets": [
          {
            "id": 2,
            "role": "observer"
          },
          {
            "id": 3,
            "role": "maintainer"
          }
        ],
        "api_endpoints": [
          1,
          5,
          7,
          32
        ]
      }
  headers:
  - name: Content-Type
    value: application/json
docs: "Creates an API-only user that does not have access to the UI.\n\n`POST /api/v1/fleet/users/api_only`\n\n\
  | Name                    | Type    | In    | Description |\n| :---------------------- | :------ | :---- | :----------\
  \ |\n| name    | string  | body | The display name for the API-only user. |                                  \
  \       \n| global_role | string | body | The role assigned to the user. If `global_role` is specified, `fleets`\
  \ cannot be specified. For more information, see [manage access](https://fleetdm.com/docs/using-fleet/manage-access).\
  \ |\n| fleets      | array   | body | _Available in Fleet Premium_. The fleets and respective roles assigned to\
  \ the user. Should contain an array of objects in which each object includes the fleet's `id` and the user's `role`\
  \ on each fleet. If `fleets` is specified, `global_role` cannot be specified. For more information, see [manage\
  \ access](https://fleetdm.com/docs/using-fleet/manage-access). |\n| api_endpoints | array   | body | _Available\
  \ in Fleet Premium_. A list of `id`s of API endpoints this user will have access to. For available endpoints,\
  \ see [List API endpoints for API-only user permissions](#list-api-endpoints-for-api-only-user-permissions). |\n\
  \nIf `api_endpoints` is specified, these do not grant additional permissions otherwise forbidden by the user's\
  \ `role`.\n\n\n#### Example\n\n`POST /api/v1/fleet/users/api_only`\n\n##### Request body\n\n```json\n{\n  \"name\"\
  : \"Jane Doe\",\n  \"fleets\": [\n    {\n      \"id\": 2,\n      \"role\": \"observer\"\n    },\n    {\n     \
  \ \"id\": 3,\n      \"role\": \"maintainer\"\n    }\n  ], \n  \"api_endpoints\": [1,5,7,32]\n}\n```\n\n##### Default\
  \ response\n\n`Status: 200`\n\n```json\n{\n  \"user\": {\n    \"created_at\": \"0001-01-01T00:00:00Z\",\n    \"\
  updated_at\": \"0001-01-01T00:00:00Z\",\n    \"id\": 5,\n    \"name\": \"Jane Doe\",\n    \"email\": \"janedoe+randomlygeneratedstring@example.com\"\
  ,\n    \"enabled\": true,\n    \"force_password_reset\": false,\n    \"gravatar_url\": \"\",\n    \"sso_enabled\"\
  : false,\n    \"mfa_enabled\": false,\n    \"api_only\": true,\n    \"global_role\": null,\n    \"fleets\": [\n\
  \      {\n        \"id\": 2,\n        \"role\": \"observer\"\n      },\n      {\n        \"id\": 3,\n        \"\
  role\": \"maintainer\"\n      }\n    ], \n    \"api_endpoints\": [1,5,7,32]\n  },\n  \"token\": \"{API key}\"\n\
  }\n```\n\nReference: https://fleetdm.com/docs/rest-api/rest-api#create-api-only-user"
examples:
- name: 200 Default response
  request:
    method: POST
    url: '{{baseUrl}}/api/v1/fleet/users/api_only'
    body:
      type: json
      data: |-
        {
          "name": "Jane Doe",
          "fleets": [
            {
              "id": 2,
              "role": "observer"
            },
            {
              "id": 3,
              "role": "maintainer"
            }
          ],
          "api_endpoints": [
            1,
            5,
            7,
            32
          ]
        }
    headers:
    - name: Content-Type
      value: application/json
  response:
    status: 200
    statusText: OK
    body:
      type: json
      data: |-
        {
          "user": {
            "created_at": "0001-01-01T00:00:00Z",
            "updated_at": "0001-01-01T00:00:00Z",
            "id": 5,
            "name": "Jane Doe",
            "email": "janedoe+randomlygeneratedstring@example.com",
            "enabled": true,
            "force_password_reset": false,
            "gravatar_url": "",
            "sso_enabled": false,
            "mfa_enabled": false,
            "api_only": true,
            "global_role": null,
            "fleets": [
              {
                "id": 2,
                "role": "observer"
              },
              {
                "id": 3,
                "role": "maintainer"
              }
            ],
            "api_endpoints": [
              1,
              5,
              7,
              32
            ]
          },
          "token": "{API key}"
        }
    headers:
    - name: Content-Type
      value: application/json
