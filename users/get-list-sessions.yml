info:
  name: List sessions
  type: http
  seq: 8
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/users/:id/sessions'
  auth: inherit
  params:
  - name: id
    value: ''
    type: path
docs: |-
  Returns a list of the user's sessions in Fleet.

  `GET /api/v1/fleet/users/:id/sessions`

  #### Parameters

  None.

  #### Example

  `GET /api/v1/fleet/users/1/sessions`

  ##### Default response

  `Status: 200`

  ```json
  {
    "sessions": [
      {
        "session_id": 2,
        "user_id": 1,
        "created_at": "2021-02-03T16:12:50Z"
      },
      {
        "session_id": 3,
        "user_id": 1,
        "created_at": "2021-02-09T23:40:23Z"
      },
      {
        "session_id": 6,
        "user_id": 1,
        "created_at": "2021-02-23T22:23:58Z"
      }
    ]
  }
  ```

  Reference: https://fleetdm.com/docs/rest-api/rest-api#list-sessions
