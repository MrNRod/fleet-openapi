  method: GET
  url: '{{baseUrl}}/api/v1/fleet/invites'
  auth: inherit
  params:
  - name: order_key
    value: ''
    type: query
    disabled: true
    description: What to order results by. Can be any column in the invites table.
  - name: order_direction
    value: ''
    type: query
    disabled: true
    description: '**Requires `order_key`**. The direction of the order given the order key. Options include `"asc"`
      and `"desc"`. Default is `"asc"`.'
  - name: query
    value: ''
    type: query
    disabled: true
    description: Search query keywords. Searchable fields include `name` and `email`.
  - name: page
    value: ''
    type: query
    disabled: true
    description: Page number of the results to fetch.
  - name: per_page
    value: ''
    type: query
    disabled: true
    description: Results per page.
