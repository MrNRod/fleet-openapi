info:
  name: Replace SCIM group
  type: http
  seq: 10
http:
  method: PUT
  url: '{{baseUrl}}/api/v1/fleet/scim/Groups/:id'
  auth: inherit
  params:
  - name: id
    value: ''
    type: path
    description: '**Required**. The group''s ID (format: `group-<number>`).'
  body:
    type: json
    data: |-
      {
        "schemas": [
          "urn:ietf:params:scim:schemas:core:2.0:Group"
        ],
        "displayName": "Engineering",
        "members": [
          {
            "value": "1"
          },
          {
            "value": "2"
          }
