          },
          "filter": {
            "supported": true,
            "maxResults": 100
          },
          "bulk": {
            "supported": false
          },
          "changePassword": {
            "supported": false
          },
          "sort": {
            "supported": false
          },
          "etag": {
            "supported": false
          }
        }
    headers:
    - name: Content-Type
      value: application/json
