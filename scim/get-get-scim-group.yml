info:
  name: Get SCIM group
  type: http
  seq: 9
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/scim/Groups/:id'
  auth: inherit
  params:
  - name: id
    value: ''
    type: path
    description: '**Required**. The group''s ID (format: `group-<number>`).'
  - name: excludedAttributes
    value: ''
    type: query
    disabled: true
    description: Comma-separated list of attributes to exclude. Use `members` to omit the member list.
docs: |-
  _Available in Fleet Premium_

  `GET /api/v1/fleet/scim/Groups/:id`

  #### Parameters

  | Name               | Type   | In    | Description                                                                              |
  | ------------------ | ------ | ----- | ---------------------------------------------------------------------------------------- |
  | id                 | string | path  | **Required**. The group's ID (format: `group-<number>`).                                 |
  | excludedAttributes | string | query | Comma-separated list of attributes to exclude. Use `members` to omit the member list.    |

  #### Example

  `GET /api/v1/fleet/scim/Groups/group-1`

  ##### Default response

  `Status: 200`

  ```json
  {
    "schemas": ["urn:ietf:params:scim:schemas:core:2.0:Group"],
    "id": "group-1",
    "externalId": "ext-group-123",
    "displayName": "Engineering",
    "members": [
      {
        "value": "1",
        "type": "User"
      }
    ],
    "meta": {
      "resourceType": "Group"
    }
  }
  ```

  ---

  Reference: https://fleetdm.com/docs/rest-api/rest-api#get-scim-group
examples:
- name: 200 Default response
  request:
    method: GET
    url: '{{baseUrl}}/api/v1/fleet/scim/Groups/:id'
    params:
    - name: id
      value: ''
      type: path
      description: '**Required**. The group''s ID (format: `group-<number>`).'
    - name: excludedAttributes
      value: ''
      type: query
      disabled: true
      description: Comma-separated list of attributes to exclude. Use `members` to omit the member list.
  response:
    status: 200
    statusText: OK
    body:
      type: json
      data: |-
        {
          "schemas": [
            "urn:ietf:params:scim:schemas:core:2.0:Group"
          ],
          "id": "group-1",
          "externalId": "ext-group-123",
          "displayName": "Engineering",
          "members": [
            {
              "value": "1",
              "type": "User"
            }
          ],
          "meta": {
            "resourceType": "Group"
          }
        }
    headers:
    - name: Content-Type
      value: application/json
