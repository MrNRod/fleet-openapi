info:
  name: Get SCIM resource types
  type: http
  seq: 15
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/scim/ResourceTypes'
  auth: inherit
docs: |-
  _Available in Fleet Premium_

  Returns the resource types supported by Fleet's SCIM implementation (`User` and `Group`).

  `GET /api/v1/fleet/scim/ResourceTypes`

  #### Parameters

  None.

  #### Example

  `GET /api/v1/fleet/scim/ResourceTypes`

  ##### Default response

  `Status: 200`

  ```json
  {
    "schemas": ["urn:ietf:params:scim:api:messages:2.0:ListResponse"],
    "totalResults": 2,
    "Resources": [
      {
        "id": "User",
        "name": "User",
        "description": "User Account",
        "endpoint": "/Users",
        "schema": "urn:ietf:params:scim:schemas:core:2.0:User"
      },
      {
        "id": "Group",
        "name": "Group",
        "description": "Group",
        "endpoint": "/Groups",
        "schema": "urn:ietf:params:scim:schemas:core:2.0:Group"
      }
    ]
  }
  ```

  ---

  Reference: https://fleetdm.com/docs/rest-api/rest-api#get-scim-resource-types
examples:
- name: 200 Default response
  request:
    method: GET
    url: '{{baseUrl}}/api/v1/fleet/scim/ResourceTypes'
  response:
    status: 200
    statusText: OK
    body:
      type: json
      data: |-
        {
          "schemas": [
            "urn:ietf:params:scim:api:messages:2.0:ListResponse"
          ],
          "totalResults": 2,
          "Resources": [
            {
              "id": "User",
              "name": "User",
              "description": "User Account",
              "endpoint": "/Users",
              "schema": "urn:ietf:params:scim:schemas:core:2.0:User"
            },
            {
              "id": "Group",
              "name": "Group",
              "description": "Group",
              "endpoint": "/Groups",
              "schema": "urn:ietf:params:scim:schemas:core:2.0:Group"
            }
          ]
        }
    headers:
    - name: Content-Type
      value: application/json
