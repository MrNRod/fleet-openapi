            "givenName": "Jane",
            "familyName": "Doe"
          },
          "emails": [
            {
              "value": "user@example.com",
              "type": "work",
              "primary": true
            }
          ],
          "active": true,
          "groups": [
            {
              "value": "group-1",
              "$ref": "Groups/group-1",
              "display": "Engineering"
            }
          ],
          "meta": {
            "resourceType": "User"
          }
        }
    headers:
    - name: Content-Type
      value: application/json
