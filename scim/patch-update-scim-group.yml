info:
  name: Update SCIM group
  type: http
  seq: 11
http:
  method: PATCH
  url: '{{baseUrl}}/api/v1/fleet/scim/Groups/:id'
  auth: inherit
  params:
  - name: id
    value: ''
    type: path
    description: '**Required**. The group''s ID (format: `group-<number>`).'
  body:
    type: json
    data: |-
      {
        "schemas": [
          "urn:ietf:params:scim:api:messages:2.0:PatchOp"
        ],
        "Operations": [
          {
            "op": "add",
            "path": "members",
            "value": [
              {
                "value": "3"
              }
            ]
          }
        ]
      }
  headers:
  - name: Content-Type
    value: application/json
docs: |-
  _Available in Fleet Premium_

  Partially updates a group using SCIM patch operations. Supports `add`, `replace`, and `remove` operations on `displayName`, `externalId`, and `members`.

  `PATCH /api/v1/fleet/scim/Groups/:id`

  #### Parameters

  | Name       | Type   | In   | Description                                                                           |
  | ---------- | ------ | ---- | ------------------------------------------------------------------------------------- |
  | id         | string | path | **Required**. The group's ID (format: `group-<number>`).                              |
  | schemas    | array  | body | **Required**. Must include `"urn:ietf:params:scim:api:messages:2.0:PatchOp"`.         |
  | Operations | array  | body | **Required**. List of patch operations. Each has `op`, optional `path`, and `value`.  |

  #### Example

  `PATCH /api/v1/fleet/scim/Groups/group-1`

  ##### Request body

  ```json
  {
    "schemas": ["urn:ietf:params:scim:api:messages:2.0:PatchOp"],
    "Operations": [
      {
        "op": "add",
        "path": "members",
        "value": [
          {
            "value": "3"
          }
        ]
      }
    ]
  }
  ```

  ##### Default response

  `Status: 200`

  ```json
  {
    "schemas": ["urn:ietf:params:scim:schemas:core:2.0:Group"],
    "id": "group-1",
    "displayName": "Engineering",
    "members": [
      {
        "value": "1",
        "type": "User"
      },
      {
        "value": "3",
        "type": "User"
      }
    ],
    "meta": {
      "resourceType": "Group"
    }
  }
  ```

  ---

  Reference: https://fleetdm.com/docs/rest-api/rest-api#update-scim-group
