info:
  name: List policy automation activities
  type: http
  seq: 2
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/policies/:id/automation_activities'
  auth: inherit
  params:
  - name: id
    value: ''
    type: path
    description: '**Required**. The policy ID.'
  - name: status
    value: ''
    type: query
    disabled: true
    description: Optional filter by automation status. Either "success" or "error"
  - name: query
    value: ''
    type: query
    disabled: true
    description: Search query to filter by. Can search by host's name.
  - name: page
    value: ''
    type: query
    disabled: true
    description: Page number of the results to fetch.
  - name: per_page
    value: ''
    type: query
    disabled: true
    description: Results per page. Maximum is 10,000 records. If no pagination parameters are specified, defaults
      to 10,000.
  - name: order_key
    value: ''
    type: query
    disabled: true
    description: What to order results by. Allowed fields are `id`, `created_at`, and `activity_type`.
  - name: order_direction
    value: ''
    type: query
    disabled: true
    description: '**Requires `order_key`**. The direction of the order given the order key. Options include `"asc"`
      and `"desc"`. Default is `"asc"`.'
  - name: after
    value: ''
    type: query
    disabled: true
    description: The value to get results after. This needs `order_key` defined, as that's the column that would
      be used.
docs: |-
  `GET /api/v1/fleet/policies/:id/automation_activities`

  #### Parameters

  | Name | Type    | In   | Description                  |
  | ---- | ------- | ---- | ---------------------------- |
  | id   | integer | path | **Required**. The policy ID. |
  | status   | string | path | Optional filter by automation status. Either "success" or "error" |
  | query   | string | path | Search query to filter by. Can search by host's name. |
  | page | integer | query | Page number of the results to fetch.|
  | per_page | integer | query | Results per page. Maximum is 10,000 records. If no pagination parameters are specified, defaults to 10,000.|
  | order_key | string | query | What to order results by. Allowed fields are `id`, `created_at`, and `activity_type`. |
  | order_direction | string | query | **Requires `order_key`**. The direction of the order given the order key. Options include `"asc"` and `"desc"`. Default is `"asc"`. |
  | after | string | query | The value to get results after. This needs `order_key` defined, as that's the column that would be used. |

  #### Example

  `GET /api/v1/fleet/policies/12/automation_activities?query=Anna's%20MacBook`

  ##### Default response

  `Status: 200`

