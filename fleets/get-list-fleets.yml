  name: List fleets
  type: http
  seq: 1
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/fleets'
  auth: inherit
  params:
  - name: page
    value: ''
    type: query
    disabled: true
    description: Page number of the results to fetch.
  - name: per_page
    value: ''
    type: query
    disabled: true
    description: Results per page.
  - name: order_key
    value: ''
    type: query
    disabled: true
    description: What to order results by. Can be any column in the `fleets` table.
  - name: order_direction
    value: ''
    type: query
    disabled: true
    description: '**Requires `order_key`**. The direction of the order given the order key. Options include `"asc"`
      and `"desc"`. Default is `"asc"`.'
  - name: query
    value: ''
    type: query
    disabled: true
    description: Search query keywords. Searchable fields include `name`.
  - name: after
    value: ''
    type: query
    disabled: true
    description: The value to get results after. This needs `order_key` defined, as that's the column that would
      be used.
docs: |-
  _Available in Fleet Premium_

  `GET /api/v1/fleet/fleets`

  `mdm.apple_settings.configuration_profiles`, `mdm.windows_settings.configuration_profiles`, `scripts`, and `mdm.setup_experience` only include the configuration profiles, scripts, and setup experience settings applied using [Fleet's YAML](https://fleetdm.com/docs/configuration/yaml-files). To list profiles, scripts, or setup experience settings added in the UI or API, use the [List configuration profiles](https://fleetdm.com/docs/rest-api/rest-api#list-custom-os-settings-configuration-profiles), [List scripts](https://fleetdm.com/docs/rest-api/rest-api#list-scripts), or GET endpoints from [Setup experience](https://fleetdm.com/docs/rest-api/rest-api#setup-experience) instead.

  #### Parameters

  | Name            | Type    | In    | Description                                                                                                                   |
  | --------------- | ------- | ----- | ----------------------------------------------------------------------------------------------------------------------------- |
  | page            | integer | query | Page number of the results to fetch.                                                                                          |
  | per_page        | integer | query | Results per page.                                                                                                             |
  | order_key       | string  | query | What to order results by. Can be any column in the `fleets` table.                                                             |
  | order_direction | string  | query | **Requires `order_key`**. The direction of the order given the order key. Options include `"asc"` and `"desc"`. Default is `"asc"`. |
  | query           | string  | query | Search query keywords. Searchable fields include `name`.                                                                      |
  | after           | string  | query | The value to get results after. This needs `order_key` defined, as that's the column that would be used. |

  #### Example

  `GET /api/v1/fleet/fleets`

  ##### Default response

  `Status: 200`

  ```json
  {
    "fleets": [
      {
        "id": 1,
        "created_at": "2021-07-28T15:58:21Z",
        "name": "workstations",
        "description": "",
        "agent_options": {
          "config": {
            "options": {
              "pack_delimiter": "/",
              "logger_tls_period": 10,
              "distributed_plugin": "tls",
              "disable_distributed": false,
              "logger_tls_endpoint": "/api/v1/osquery/log",
              "distributed_interval": 10,
              "distributed_tls_max_attempts": 3
            },
            "decorators": {
              "load": [
                "SELECT uuid AS host_uuid FROM system_info;",
                "SELECT hostname AS hostname FROM system_info;"
              ]
            }
          },
          "overrides": {},
          "command_line_flags": {}
        },
        "user_count": 0,
        "host_count": 0,
        "secrets": [
          {
            "secret": "",
            "created_at": "2021-07-28T15:58:21Z",
            "team_id": 10
          }
        ]
      },
      {
        "id": 2,
        "created_at": "2021-08-05T21:41:42Z",
        "name": "servers",
        "description": "",
        "agent_options": {
          "spec": {
            "config": {
              "options": {
                "pack_delimiter": "/",
                "logger_tls_period": 10,
                "distributed_plugin": "tls",
                "disable_distributed": false,
                "logger_tls_endpoint": "/api/v1/osquery/log",
                "distributed_interval": 10,
                "distributed_tls_max_attempts": 3
              },
              "decorators": {
                "load": [
                  "SELECT uuid AS host_uuid FROM system_info;",
                  "SELECT hostname AS hostname FROM system_info;"
                ]
              }
            },
            "overrides": {},
            "command_line_flags": {}
          },
          "user_count": 0,
          "host_count": 0,
          "secrets": [
            {
              "secret": "+ncixtnZB+IE0OrbrkCLeul3U8LMVITd",
              "created_at": "2021-08-05T21:41:42Z",
              "team_id": 15
            }
          ]
        }
      }
    ]
  }
  ```

  Reference: https://fleetdm.com/docs/rest-api/rest-api#list-fleets
