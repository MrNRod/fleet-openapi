    Copyright (c) 2020-present Fleet Device Management Inc. Copyright (c) 2017 Kolide.

    Changes: converted Markdown to OpenCollection YAML, organized requests into folders, and normalized parameters and examples. Not endorsed by Fleet. No warranties are given.
