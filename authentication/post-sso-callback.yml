info:
  name: SSO callback
  type: http
  seq: 10
http:
  method: POST
  url: '{{baseUrl}}/api/v1/fleet/sso/callback'
  body:
    type: json
    data: |-
      {
        "SAMLResponse": "<SAML response from IdP>"
      }
  headers:
  - name: Cookie
    value: __Host-FLEETSSOSESSIONID=
    description: HTTP Cookie returned in the `POST /api/v1/fleet/sso` request. This is not set/required for IdP
      initiated SSO logins
    disabled: true
  - name: Content-Type
    value: application/json
docs: |-
  This is the callback endpoint that the identity provider will use to send security assertions to Fleet. This is where Fleet receives and processes the response from the identify provider.

  `POST /api/v1/fleet/sso/callback`

  The `__Host-FLEETSSOSESSIONID` HTTP cookie must be set for non-IdP initiated SSO login requests. The value for this cookie is returned in the `POST /api/v1/fleet/sso` request.
  For IdP-initiated SSO logins the cookie doesn't need to be set.

  #### Parameters

  | Name                     | Type   | In     | Description                                                                                                         |
  | ------------------------ | ------ | ------ | ------------------------------------------------------------------------------------------------------------------- |
  | SAMLResponse             | string | body   | **Required**. The SAML response from the identity provider.                                                         |
  | __Host-FLEETSSOSESSIONID | string | cookie | HTTP Cookie returned in the `POST /api/v1/fleet/sso` request. This is not set/required for IdP initiated SSO logins |

  #### Example

  `POST /api/v1/fleet/sso/callback`

  ##### Request body

  ```json
  {
    "SAMLResponse": "<SAML response from IdP>"
  }
  ```

  Example session cookie set in the `Cookie` request header:
  ```
  Cookie: __Host-FLEETSSOSESSIONID=slI727JZ+j0FvyBRLyD/gri1rxtwpaZT
  ```

  ##### Default response

  `Status: 200`


  ---

  Reference: https://fleetdm.com/docs/rest-api/rest-api#sso-callback
examples:
- name: 200 Default response
  request:
    method: POST
    url: '{{baseUrl}}/api/v1/fleet/sso/callback'
    body:
      type: json
      data: |-
        {
          "SAMLResponse": "<SAML response from IdP>"
        }
    headers:
    - name: Cookie
      value: __Host-FLEETSSOSESSIONID=
      description: HTTP Cookie returned in the `POST /api/v1/fleet/sso` request. This is not set/required for IdP
        initiated SSO logins
      disabled: true
    - name: Content-Type
      value: application/json
  response:
    status: 200
    statusText: OK
