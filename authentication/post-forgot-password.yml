info:
  name: Forgot password
  type: http
  seq: 3
http:
  method: POST
  url: '{{baseUrl}}/api/v1/fleet/forgot_password'
  body:
    type: json
    data: |-
      {
        "email": "janedoe@example.com"
      }
  headers:
  - name: Content-Type
    value: application/json
docs: |-
  Sends a password reset email to the specified email. Requires that SMTP or SES is configured for your Fleet server.

  `POST /api/v1/fleet/forgot_password`

  #### Parameters

  | Name  | Type   | In   | Description                                                             |
  | ----- | ------ | ---- | ----------------------------------------------------------------------- |
  | email | string | body | **Required**. The email of the user requesting the reset password link. |

  #### Example

  `POST /api/v1/fleet/forgot_password`

  ##### Request body

  ```json
  {
    "email": "janedoe@example.com"
  }
  ```

  ##### Default response

  `Status: 200`

  ##### Unknown error

  `Status: 500`

  ```json
  {
    "message": "Unknown Error",
    "errors": [
      {
        "name": "base",
        "reason": "email not configured"
      }
    ]
  }
  ```

  ---

  Reference: https://fleetdm.com/docs/rest-api/rest-api#forgot-password
examples:
- name: 200 Default response
  request:
    method: POST
    url: '{{baseUrl}}/api/v1/fleet/forgot_password'
    body:
      type: json
      data: |-
        {
          "email": "janedoe@example.com"
        }
    headers:
    - name: Content-Type
      value: application/json
  response:
    status: 200
    statusText: OK
- name: 500 Unknown error
  request:
    method: POST
    url: '{{baseUrl}}/api/v1/fleet/forgot_password'
    body:
      type: json
      data: |-
        {
          "email": "janedoe@example.com"
        }
