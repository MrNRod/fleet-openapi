info:
  name: Update password
  type: http
  seq: 4
http:
  method: POST
  url: '{{baseUrl}}/api/v1/fleet/change_password'
  auth: inherit
  body:
    type: json
    data: |-
      {
        "old_password": "VArCjNW7CfsxGp67",
        "new_password": "zGq7mCLA6z4PzArC"
      }
  headers:
  - name: Content-Type
    value: application/json
docs: |-
  `POST /api/v1/fleet/change_password`

  Changes the password for the authenticated user.

  #### Parameters

  | Name         | Type   | In   | Description                            |
  | ------------ | ------ | ---- | -------------------------------------- |
  | old_password | string | body | **Required**. The user's old password. |
  | new_password | string | body | **Required**. The user's new password. |

  #### Example

  `POST /api/v1/fleet/change_password`

  ##### Request body

  ```json
  {
    "old_password": "VArCjNW7CfsxGp67",
    "new_password": "zGq7mCLA6z4PzArC"
  }
  ```

  ##### Default response

  `Status: 200`

  ##### Validation failed

  `Status: 422 Unprocessable entity`

  ```json
  {
    "message": "Validation Failed",
    "errors": [
      {
        "name": "old_password",
        "reason": "old password does not match"
      }
    ]
  }
  ```

  Reference: https://fleetdm.com/docs/rest-api/rest-api#update-password
examples:
- name: 200 Default response
  request:
