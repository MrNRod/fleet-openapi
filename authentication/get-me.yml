info:
  name: Me
  type: http
  seq: 6
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/me'
  auth: inherit
  params:
  - name: include_ui_settings
    value: ''
    type: query
    disabled: true
    description: 'If set to true, includes the columns the user hides on the **Hosts** page (default: `false`).'
docs: |-
  Retrieves the user data for the authenticated user.

  `GET /api/v1/fleet/me`

  #### Parameters

  | Name                      | Type   | In   | Description                                                               |
  | ------------------------- | ------ | ---- | ------------------------------------------------------------------------- |
  | include_ui_settings       | boolean | query | If set to true, includes the columns the user hides on the **Hosts** page (default: `false`). |

  #### Example

  `GET /api/v1/fleet/me`

  ##### Default response

  `Status: 200`

  ```json
  {
    "user": {
      "created_at": "2020-11-13T22:57:12Z",
      "updated_at": "2020-11-16T23:49:41Z",
      "id": 1,
      "name": "Jane Doe",
      "email": "janedoe@example.com",
      "global_role": "admin",
      "enabled": true,
      "force_password_reset": false,
      "gravatar_url": "",
      "sso_enabled": false,
      "teams": [],
      "fleets": []
    },
    "available_teams" : [
      {
        "id": 1,
        "name": "Workstations",
        "description": "Employee workstations"
      }
    ],
      "available_fleets" : [
      {
        "id": 1,
        "name": "Workstations",
        "description": "Employee workstations"
      }
    ]
  }
  ```

  ---

  Reference: https://fleetdm.com/docs/rest-api/rest-api#me
examples:
