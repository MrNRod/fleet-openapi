  name: Update global enroll secrets
  type: http
  seq: 7
http:
  method: POST
  url: '{{baseUrl}}/api/v1/fleet/spec/enroll_secret'
  auth: inherit
  body:
    type: json
    data: |-
      {
        "spec": {
          "secrets": [
            {
              "secret": "KuSkYFsHBQVlaFtqOLwoUIWniHhpvEhP"
            }
