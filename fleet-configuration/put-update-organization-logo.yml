      disabled: true
      type: file
docs: |-
  Upload a custom logo to display in the top navigation, setup experience window, and MDM migration dialog.

  > You need to send a request of type `multipart/form-data`.

  `PUT /api/v1/fleet/logo`

  #### Parameters

  | Name        | Type    | In   | Description                                      |
  | ----        | ------- | ---- | --------------------------------------------     |
  | logo        | file    | body | The logo image to upload. For best results, use a square logo at least 150px x 150px. |
  | mode        | string  | query | Either `"light"` for the logo displayed in light mode, `"dark" for the logo displayed in dark mode`, or "all" to replace both light and dark mode logos. (Default: `"all"`.)|

  #### Example

  `PUT /api/v1/fleet/logo?mode=light`

  ##### Request body

  ```http
  icon="fleet-logo-150x150.png"
  ```

  ##### Default response

  `Status: 204`

  Reference: https://fleetdm.com/docs/rest-api/rest-api#update-organization-logo
examples:
- name: 204 Default response
  request:
    method: PUT
    url: '{{baseUrl}}/api/v1/fleet/logo'
    params:
    - name: mode
      value: ''
      type: query
      disabled: true
      description: 'Either `"light"` for the logo displayed in light mode, `"dark" for the logo displayed in dark
        mode`, or "all" to replace both light and dark mode logos. (Default: `"all"`.)'
    body:
      type: multipart-form
      data:
      - name: logo
        value: []
        description: The logo image to upload. For best results, use a square logo at least 150px x 150px.
        disabled: true
        type: file
  response:
    status: 204
    statusText: No Content
