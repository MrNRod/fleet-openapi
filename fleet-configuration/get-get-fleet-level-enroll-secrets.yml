info:
  name: Get fleet-level enroll secrets
  type: http
  seq: 8
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/fleets/:id/secrets'
  auth: inherit
  params:
  - name: id
    value: ''
    type: path
docs: |-
  Returns the fleet's enroll secrets.

  `GET /api/v1/fleet/fleets/:id/secrets`

  #### Parameters

  None.

  #### Example

  `GET /api/v1/fleet/fleets/1/secrets`

  ##### Default response

  `Status: 200`

  ```json
  {
    "secrets": [
      {
        "created_at": "2021-06-16T22:05:49Z",
        "secret": "aFtH2Nq09hrvi73ErlWNQfa7M53D3rPR",
        "team_id": 1,
        "fleet_id": 1
      }
    ]
  }
  ```

  Reference: https://fleetdm.com/docs/rest-api/rest-api#get-fleet-level-enroll-secrets
examples:
- name: 200 Default response
  request:
