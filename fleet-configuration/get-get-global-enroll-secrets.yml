info:
  name: Get global enroll secrets
  type: http
  seq: 4
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/spec/enroll_secret'
  auth: inherit
docs: |-
  Returns the valid global enroll secrets.

  `GET /api/v1/fleet/spec/enroll_secret`

  #### Parameters

  None.

  #### Example

  `GET /api/v1/fleet/spec/enroll_secret`

  ##### Default response

  `Status: 200`

  ```json
  {
    "spec": {
      "secrets": [
        {
          "secret": "vhPzPOnCMOMoqSrLxKxzSADyqncayacB",
          "created_at": "2021-11-12T20:24:57Z"
        },
        {
          "secret": "jZpexWGiXmXaFAKdrdttFHdJBqEnqlVF",
          "created_at": "2021-11-12T20:24:57Z"
        }
      ]
    }
  }
  ```

  Reference: https://fleetdm.com/docs/rest-api/rest-api#get-global-enroll-secrets
examples:
- name: 200 Default response
  request:
    method: GET
    url: '{{baseUrl}}/api/v1/fleet/spec/enroll_secret'
  response:
    status: 200
    statusText: OK
    body:
      type: json
      data: |-
        {
          "spec": {
            "secrets": [
              {
                "secret": "vhPzPOnCMOMoqSrLxKxzSADyqncayacB",
