  ##### mdm.apple_settings

  `mdm.apple_settings` is an object with the following structure:

  | Name                                   | Type    | Description   |
  | -------------------------------------- | ------- | -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
