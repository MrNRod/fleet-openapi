docs: |-
  Removes a custom variable from Fleet.

  `DELETE /api/v1/fleet/custom_variables/:id`

  #### Example

  `DELETE /api/v1/fleet/custom_variables/123`

  ##### Default response

  `Status: 200`

  Reference: https://fleetdm.com/docs/rest-api/rest-api#delete-custom-variable
