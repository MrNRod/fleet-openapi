  method: GET
  url: '{{baseUrl}}/api/v1/fleet/hosts/:id/certificates'
  auth: inherit
  params:
  - name: id
    value: ''
    type: path
    description: '**Required**. The host''s id.'
  - name: page
    value: ''
    type: query
    disabled: true
    description: Page number of the results to fetch.
  - name: per_page
    value: ''
    type: query
    disabled: true
    description: Results per page.
  - name: order_key
    value: ''
    type: query
