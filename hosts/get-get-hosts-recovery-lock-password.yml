info:
  name: Get host's Recovery Lock password
  type: http
  seq: 25
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/hosts/:id/recovery_lock_password'
  auth: inherit
  params:
  - name: id
    value: ''
    type: path
    description: '**Required** The id of the host to get the Recovery Lock password for.'
docs: |-
  Retrieves the Recovery Lock password for a host.

  The host will only return a password if its Recovery Lock password status is "Verified."

  `GET /api/v1/fleet/hosts/:id/recovery_lock_password`

  #### Parameters

  | Name | Type    | In   | Description                                                            |
  | ---- | ------- | ---- | ---------------------------------------------------------------------- |
  | id   | integer | path | **Required** The id of the host to get the Recovery Lock password for. |


  #### Example

  `GET /api/v1/fleet/hosts/8/recovery_lock_password`

  ##### Default response

  `Status: 200`

  ```json
  {
    "host_id": 8,
    "recovery_lock_password": {
      "password": "test-123",
      "updated_at": "2026-02-01T05:31:43Z"
    }
  }
  ```

  Reference: https://fleetdm.com/docs/rest-api/rest-api#get-hosts-recovery-lock-password
examples:
- name: 200 Default response
  request:
    method: GET
    url: '{{baseUrl}}/api/v1/fleet/hosts/:id/recovery_lock_password'
    params:
    - name: id
      value: ''
      type: path
      description: '**Required** The id of the host to get the Recovery Lock password for.'
  response:
    status: 200
    statusText: OK
    body:
      type: json
      data: |-
        {
          "host_id": 8,
          "recovery_lock_password": {
            "password": "test-123",
            "updated_at": "2026-02-01T05:31:43Z"
          }
        }
    headers:
    - name: Content-Type
      value: application/json
