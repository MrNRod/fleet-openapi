    params:
    - name: identifier
      value: ''
      type: path
      description: '**Required**. The host''s `hardware_serial`, `uuid`, `osquery_host_id`, `hostname`, or `node_key`.'
    body:
      type: json
      data: |-
        {
          "query": "SELECT model, vendor FROM usb_devices;"
        }
    headers:
    - name: Content-Type
      value: application/json
  response:
    status: 200
    statusText: OK
    body:
      type: json
      data: |-
        {
          "host_id": 123,
          "query": "SELECT model, vendor FROM usb_devices;",
          "status": "online",
          "error": null,
          "rows": [
            {
              "model": "USB2.0 Hub",
              "vendor": "VIA Labs, Inc."
            }
          ]
        }
    headers:
    - name: Content-Type
      value: application/json
