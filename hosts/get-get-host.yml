  \          \"profile_uuid\": \"g954ec5ea-a334-4825-87b3-937e7e381f24\",\n          \"name\": \"Android Wi-Fi Profile\"\
  ,\n          \"status\": \"verified\",\n          \"operation_type\": \"install\",\n          \"scope\": null,\n\
  \          \"managed_local_account\": null,\n          \"detail\": \"\"\n        }\n      ]\n    }\n  }\n}\n```\n\
  \n`mdm.os_settings.host_name` reports the host name template enforcement status for a macOS, iOS, or iPadOS host.\
  \ Its `status` is one of `pending`, `verifying`, `verified`, or `failed`, and `detail` carries the error message\
  \ when the status is `failed`. The object is omitted entirely for hosts that aren't enforced (no template set\
  \ on the host's fleet or on \"Unassigned\", non-MDM hosts, and personal (BYOD) enrollments).\n\n`mdm.os_settings.disk_encryption.action_required`\
  \ names what the **end user** can do about a disk encryption problem, and is only present when there is something\
  \ they can do. On Windows it is `create_pin` when BitLocker policy requires a startup PIN the end user hasn't\
  \ set, and `restart` when Fleet is waiting for a pending restart before turning protection back on. On macOS it\
  \ is `log_out` or `rotate_key`. It's absent when `status` is `action_required` for a reason the end user can't\
  \ fix, such as a TPM that isn't ready or a policy that forbids the key protector Fleet needs.\n\n`mdm.bootstrap_token_escrowed`\
  \ indicates whether Fleet has escrowed a [bootstrap token](https://support.apple.com/guide/deployment/use-secure-and-bootstrap-tokens-dep24dbdcf9e/web)\
  \ for the macOS host. The bootstrap token authorizes certain MDM operations, such as remote wipe and installing\
  \ OS updates, without requiring a user with a secure token to be logged in. This field is only present for macOS\
  \ hosts.\n\nEntries in `mdm.profiles` that represent an Android certificate carry a `certificate_template_id`,\
  \ plus `retrying`, `retry_count`, and `max_retries`. When a host reports a failed certificate install, Fleet automatically\
  \ re-delivers the certificate up to `max_retries` times, which puts it back into an in-progress `status` while\
  \ `detail` still holds the reported error. `retrying` is `true` for the duration of that window, and `retry_count`\
  \ is how many retries have been used. A manual resend also sets `retry_count`, so only `retrying` identifies an\
  \ automatic retry. These four fields are omitted for every other kind of profile, and the retry fields are also\
  \ omitted when `operation_type` is `remove`, since removals are never retried.\n\n`browser` and `extension_for`\
  \ fields are included when set and when empty. `extension_for` shows the browser or Visual Studio Code fork associated\
  \ with the extension, allowing for differentiation between e.g. an extension installed on Visual Studio Code and\
  \ one installed on Cursor. `browser` is deprecated, and only shows this information for browser plugins.\n\n`release`\
  \ is included when set. For `rpm_packages`, it's the package release (for example, `1.212.el6`). For `go_binaries`,\
  \ it's the version of the Go toolchain the binary was built with (for example, `go1.26.1`). Fleet uses it to detect\
  \ Go standard library vulnerabilities, so the same binary version built with two toolchains is listed as two versions.\
  \ `generated_cpe` is empty for Go binaries. Their vulnerabilities come from the [Go vulnerability database](https://vuln.go.dev)\
  \ instead of NVD.\n\n> Note: the response above assumes a [GeoIP database is configured](https://fleetdm.com/docs/deploying/configuration#geoip),\
  \ otherwise the `geolocation` object won't be included.\n\n> Note: `disk_encryption_enabled` is omitted when Fleet\
  \ doesn't know the host's disk encryption status, such as when the host hasn't reported it yet. It's also omitted\
  \ for Linux hosts that report their root volume as unencrypted, because Fleet can't confirm that a Linux host's\
  \ disk is unencrypted.\n\n> Note: `installed_paths` may be blank depending on installer package. For example,\
  \ on Linux, RPM-installed packages do not provide installed path information.\n\n> Note: \n> - `signature_information`\
  \ is set for macOS apps (`source: apps`) and Homebrew formulae (`source: homebrew_packages`). Apps get one entry\
  \ per bundle. Homebrew formulae get one entry per Mach-O executable in the formula's `bin` and `sbin` directories,\
  \ with `executable_path` and `executable_sha256`. For those entries, `team_identifier` is empty and `hash_sha256`\
  \ is `null`. Homebrew hashes require fleetd 1.63.0.\n> - Currently, the following are supported only for iOS/iPadOS:\
  \ `accessibility_settings`, `app_analytics_enabled`, `awaiting_configuration`, `battery_level`, `bluetooth_mac`,\
  \ `cellular_technology`, `data_roaming_enabled`, `device_properties_attestation`, `diagnostic_submission_enabled`,\
  \ `eas_device_identifier`, `is_cloud_backup_enabled`, `is_device_locator_service_enabled`, `is_do_not_disturb_in_effect`,\
  \ `is_mdm_lost_mode_enabled`, `is_network_tethered`, `itunes_store_account_hash`, `itunes_store_account_is_active`,\
  \ `last_cloud_backup_date`, `mdm_options`, `model_number`, `modem_firmware_version`, `organization_info`, `personal_hotspot_enabled`,\
  \ `push_token`, `service_subscriptions`, `supplemental_build_version`, `supplemental_os_version_extra`, `udid`,\
  \ and `wifi_mac`.\n> - These iOS/iPadOS vitals are collected via Apple's [`DeviceInformation`](https://developer.apple.com/documentation/devicemanagement/deviceinformationcommand/command-data.dictionary/queries-data.dictionary)\
  \ MDM command. A property the device doesn't report is omitted from the response rather than returned as `null`.\
  \ The exception is `mdm_options`, which is returned as an empty object when the device reports it with nothing\
  \ set.\n> - `cellular_technology` is one of `None`, `GSM`, `CDMA`, or `GSM and CDMA`. This will be `unknown` if\
  \ Apple adds a value in the future that Fleet doesn't recognize.\n> - `device_properties_attestation` is an array\
  \ of base64-encoded DER certificates forming a chain, leaf first. The chain is anchored to Apple's Enterprise\
  \ Attestation Root CA, which is not itself included in the array.\n> - Currently, the following are supported\
  \ only for Android: `adb_enabled`, `api_level`, `bootloader_version`, `device_kernel_version`, `encryption_type`,\
  \ `imei`, `manufacturer`, `meid`, `passcode_protected`, `play_protect_enabled`, `security_posture`, `security_posture_details`,\
  \ `security_update_version`, `system_update_status`, and `telephony_infos`.\n> - These Android vitals are collected\
  \ from the status reports Fleet receives from the [Android Management API](https://developers.google.com/android/management/reference/rest/v1/enterprises.devices)\
  \ (AMAPI). A vital the device doesn't report is omitted from the response rather than returned as `null`. A host\
  \ that hasn't sent a status report yet returns none of them, and a device whose Android version doesn't report\
  \ a given vital omits just that one.\n> - `telephony_infos`, `imei`, and `meid` are never returned for a personal\
  \ (BYOD) enrollment. AMAPI only reports them for fully managed devices in the first place, and Fleet gates the\
  \ response on its own enrollment record so they stay hidden after a BYOD host unenrolls. `telephony_infos` holds\
  \ one entry per SIM card, so a dual-SIM host reports more than one, and it requires Android 6 or above. Its `activation_state`\
  \ and `config_mode` describe eSIMs on Android 15 and above only. A host reports either `imei` or `meid` depending\
  \ on its radio, never both.\n> - `security_posture_details[].advice` holds AMAPI's default, non-localized admin-facing\
  \ message for each risk. Fleet has no device locale to select a localized variant with, so the localized messages\
  \ aren't returned.\n> - `encryption_type`, `security_posture`, `system_update_status`, `security_posture_details[].security_risk`,\
  \ `telephony_infos[].activation_state`, and `telephony_infos[].config_mode` carry AMAPI's raw enum values, such\
  \ as `ACTIVE`, `AT_RISK`, `UP_TO_DATE`, `UNKNOWN_OS`, `ACTIVATED`, and `ADMIN_CONFIGURED`. AMAPI's \"no data\"\
  \ sentinels (`*_UNSPECIFIED` and `UPDATE_STATUS_UNKNOWN`) are omitted from the response instead of being returned.\n\
  > - `security_update_version` is the host's Android security patch level. It's also folded into `os_version`,\
  \ for example `Android 16 (2026-05-01)`.\n\n> Note:\n> - `orbit_version: null` means this agent is not a fleetd\
  \ agent\n> - `fleet_desktop_version: null` means this agent is not a fleetd agent, or this agent is version <=1.23.0\
  \ which is not collecting the desktop version\n> - `fleet_desktop_version: \"\"` means this agent is a fleetd\
  \ agent but does not have fleet desktop\n> - `scripts_enabled: null` means this agent is not a fleetd agent, or\
  \ this agent is version <=1.23.0 which is not collecting the scripts enabled info\n\n> Note: [Get human-device\
  \ mapping](https://github.com/fleetdm/fleet/blob/62dc32454f6a40e81fe229abdfc370d3bf7a56c6/docs/REST%20API/rest-api.md?plain=1#L3518)\
  \ is deprecated as of Fleet 4.67.0. It is maintained for backwards compatibility. Please use the [Get host](#get-host)\
  \ endpoint to get human-device mapping.\n\n> Note: `mdm.is_personal_enrollment` reports whether the last MDM enrollment\
  \ Fleet recorded for the host was personal (BYOD). Unlike `mdm.enrollment_status`, it is not cleared when the\
  \ host unenrolls, so it stays `true` for an unenrolled Android or Apple mobile host. On macOS and Windows, MDM\
  \ state is re-reported by the agent, which resets the field once the enrollment profile is gone.\n\n> Note: For\
  \ iOS, iPadOS, and Android hosts with ⁠`mdm.enrollment_status` set to \"On (personal)\", ⁠`hardware_serial` and\
  \ ⁠`uuid` represent a temporary enrollment ID. For Android work profile, this is what Google calls an [enterprise-specific\
  \ ID](https://developer.android.com/work/versions/android-12#:~:text=An%20enrollment%2Dspecific%20ID%20provides%20a%20unique%20ID%20that%20identifies%20the%20work%20profile%20enrollment%20in%20a%20particular%20organization%2C%20and%20will%20remain%20stable%20across%20factory%20resets).\n\
  \nReference: https://fleetdm.com/docs/rest-api/rest-api#get-host"
