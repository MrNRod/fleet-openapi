info:
  name: Get host
  type: http
  seq: 4
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/hosts/:id'
  auth: inherit
  params:
  - name: id
    value: ''
    type: path
    description: '**Required**. The host''s id.'
  - name: exclude_software
    value: ''
    type: query
    disabled: true
    description: If `true`, the response will not include a list of installed software for the host.
  - name: exclude_fleet_maintained_policies
    value: ''
    type: query
    disabled: true
    description: If `true`, will omit Fleet-maintained policies from the policies list.
docs: "Returns the information of the specified host.\n\n`GET /api/v1/fleet/hosts/:id`\n\n> If you're hitting this\
  \ endpoint often (e.g. every hour) for a large number of hosts (e.g. 1k+) the best practice is to set the `exclude_software`\
  \ to `true` to prevent overloading the Fleet server.\n\n\n#### Parameters\n\n| Name             | Type    | In\
  \    | Description                                                                             |\n|------------------|---------|-------|-----------------------------------------------------------------------------------------|\n\
  | id               | integer | path  | **Required**. The host's id.                                          \
  \                  |\n| exclude_software | boolean | query | If `true`, the response will not include a list of\
  \ installed software for the host.     |\n| exclude_fleet_maintained_policies | boolean | query | If `true`, will\
  \ omit Fleet-maintained policies from the policies list. |\n\n#### Example (macOS)\n\n`GET /api/v1/fleet/hosts/121`\n\
