          "last_uninstall": null,
          "package_url": null,
          "categories": [
            "Browsers"
          ]
        },
        "app_store_app": null
      },
      {
        "id": 1042,
        "name": "git",
        "icon_url": null,
        "source": "homebrew_packages",
        "extension_for": "",
        "status": null,
        "installed_versions": [
          {
            "version": "2.46.0",
            "bundle_identifier": "",
            "vulnerabilities": null,
            "installed_paths": [
              "/opt/homebrew/Cellar/git"
            ],
            "signature_information": [
              {
                "installed_path": "/opt/homebrew/Cellar/git",
                "team_identifier": "",
                "hash_sha256": null,
                "executable_sha256": "2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae",
                "executable_path": "/opt/homebrew/Cellar/git/2.46.0/bin/git"
              },
              {
                "installed_path": "/opt/homebrew/Cellar/git",
                "team_identifier": "",
                "hash_sha256": null,
                "executable_sha256": "fcde2b2edba56bf408601fb721fe9b5c338d10ee429ea04fae5511b68fbf8fb9",
                "executable_path": "/opt/homebrew/Cellar/git/2.46.0/bin/git-shell"
              }
            ],
            "last_opened_at": ""
          }
        ],
        "display_name": "",
        "software_package": null,
        "app_store_app": null
      }
    ],
    "meta": {
      "has_next_results": false,
      "has_previous_results": false
    }
  }
  ```

  Reference: https://fleetdm.com/docs/rest-api/rest-api#get-hosts-software
