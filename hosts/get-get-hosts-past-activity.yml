info:
  name: Get host's past activity
  type: http
  seq: 33
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/hosts/:id/activities'
  auth: inherit
  params:
  - name: id
    value: ''
    type: path
    description: '**Required**. The host''s ID.'
  - name: page
    value: ''
    type: query
    disabled: true
    description: Page number of the results to fetch.
  - name: per_page
    value: ''
    type: query
    disabled: true
    description: Results per page. Maximum is 10,000 records. If no pagination parameters are specified, defaults
      to 10,000.
  - name: order_key
    value: ''
    type: query
    disabled: true
    description: What to order results by. Allowed fields are `id`, `created_at`, `user_id`, `activity_type`, `user_name`,
      `user_email`, and `fleet_initiated`.
  - name: order_direction
    value: ''
    type: query
    disabled: true
    description: '**Requires `order_key`**. The direction of the order given the order key. Options include `"asc"`
      and `"desc"`. Default is `"asc"`.'
  - name: after
    value: ''
    type: query
    disabled: true
    description: The value to get results after. This needs `order_key` defined, as that's the column that would
      be used.
docs: |-
  `GET /api/v1/fleet/hosts/:id/activities`

  #### Parameters

  | Name | Type    | In   | Description                  |
  | ---- | ------- | ---- | ---------------------------- |
  | id   | integer | path | **Required**. The host's ID. |
  | page | integer | query | Page number of the results to fetch.|
  | per_page | integer | query | Results per page. Maximum is 10,000 records. If no pagination parameters are specified, defaults to 10,000.|
  | order_key | string | query | What to order results by. Allowed fields are `id`, `created_at`, `user_id`, `activity_type`, `user_name`, `user_email`, and `fleet_initiated`. |
  | order_direction | string | query | **Requires `order_key`**. The direction of the order given the order key. Options include `"asc"` and `"desc"`. Default is `"asc"`. |
  | after | string | query | The value to get results after. This needs `order_key` defined, as that's the column that would be used. |

  #### Example

  `GET /api/v1/fleet/hosts/12/activities`

  ##### Default response

  `Status: 200`

  ```json
  {
    "activities": [
      {
        "created_at": "2025-02-20T10:09:48.551757Z",
        "id": 123,
        "actor_full_name": "Anna Chao",
        "actor_id": 12,
        "actor_gravatar": "",
        "actor_email": "anna@example.com",
        "type": "installed_software",
        "fleet_initiated": false,
        "details": {
            "status": "installed",
            "host_id": 934,
            "policy_id": null,
            "policy_name": null,
            "install_uuid": "2fddb3d3-d553-4334-89a3-235da50d0ee7",
            "self_service": false,
            "software_title": "Notion.app",
            "software_package": "Notion-4.5.0-arm64.dmg",
            "host_display_name": "Marko's MacBook Pro"
        }
      },
      {
        "created_at": "2023-07-27T14:35:08Z",
        "id": 2,
        "actor_full_name": "Anna Chao",
        "actor_id": 12,
        "actor_gravatar": "",
        "actor_email": "anna@example.com",
        "type": "ran_script",
        "fleet_initiated": true,
        "details": {
          "host_id": 1,
          "host_display_name": "Steve's MacBook Pro",
          "script_name": "set-timezones.sh",
          "script_execution_id": "d6cffa75-b5b5-41ef-9230-15073c8a88cf",
          "async": true
        }
      }
    ],
    "meta": {
      "has_next_results": false,
      "has_previous_results": false
    }
  }
  ```

  Reference: https://fleetdm.com/docs/rest-api/rest-api#get-hosts-past-activity
