info:
  name: Update hosts' fleet
  type: http
  seq: 10
http:
  method: POST
  url: '{{baseUrl}}/api/v1/fleet/hosts/transfer'
  auth: inherit
  body:
    type: json
    data: |-
      {
        "team_id": 1,
        "fleet_id": 1,
        "hosts": [
          3,
          2,
          4,
          6,
          1,
          5,
          7
        ]
      }
  headers:
  - name: Content-Type
    value: application/json
docs: |-
  _Available in Fleet Premium_

  `POST /api/v1/fleet/hosts/transfer`

  #### Parameters

  | Name    | Type    | In   | Description                                                             |
  | ------- | ------- | ---- | ----------------------------------------------------------------------- |
  | fleet_id | integer | body | **Required**. The ID of the fleet you'd like to assign the host(s) to. |
  | hosts   | array   | body | **Required**. A list of host IDs.                                       |

  #### Example

  `POST /api/v1/fleet/hosts/transfer`

  ##### Request body

  ```json
  {
    "team_id": 1,
    "fleet_id": 1,
    "hosts": [3, 2, 4, 6, 1, 5, 7]
  }
  ```

  ##### Default response

  `Status: 200`

  Reference: https://fleetdm.com/docs/rest-api/rest-api#update-hosts-fleet
examples:
