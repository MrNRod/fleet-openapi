info:
  name: Rotate host's managed local account password
  type: http
  seq: 42
http:
  method: POST
  url: '{{baseUrl}}/api/v1/fleet/hosts/:id/managed_account_password/rotate'
  auth: inherit
  params:
  - name: id
    value: ''
    type: path
    description: The host ID to rotate the managed local account password for.
docs: |-
  _Available in Fleet Premium_

  Rotates the managed local account password for a macOS or Windows host.

  On macOS, Fleet generates the new password and sends it to the host in an MDM command. On Windows, Fleet asks fleetd to generate a new password, set it, and send it back, so the rotation completes on the host's next check-in.

  `POST /api/v1/fleet/hosts/:id/managed_account_password/rotate`

  #### Parameters

  | Name                          | Type    | In    | Description                                                                                        |
  | ----------------------------- | ------  | ----  | --------------------------------------------------------------------------------------             |
  | id                            | integer | path  | The host ID to rotate the managed local account password for.                                      |

  #### Example

  `POST /api/v1/fleet/hosts/123/managed_account_password/rotate`

  ##### Default response

  `Status: 204`

  Reference: https://fleetdm.com/docs/rest-api/rest-api#rotate-hosts-managed-local-account-password
