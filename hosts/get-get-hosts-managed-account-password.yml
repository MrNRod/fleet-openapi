info:
  name: Get host's managed account password
  type: http
  seq: 43
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/hosts/:id/managed_account_password'
  auth: inherit
  params:
  - name: id
    value: ''
    type: path
    description: '**Required** The ID of the host to get the managed account password for.'
docs: |-
  Retrieves the managed account password for a macOS host.

  On macOS, a password is returned only while its managed account password status is "Verified". On Windows, a password is returned whenever one has been escrowed, including after a failed rotation, in which case it is the last password the host reported.

  `GET /api/v1/fleet/hosts/:id/managed_account_password`

  #### Parameters

  | Name | Type    | In   | Description                                                              |
  | ---- | ------- | ---- | ------------------------------------------------------------------------ |
  | id   | integer | path | **Required** The ID of the host to get the managed account password for. |


  #### Example

  `GET /api/v1/fleet/hosts/8/managed_account_password`

  ##### Default response

  `Status: 200`

  ```json
  {
    "host_id": 8,
    "managed_account_password": {
      "password": "test-123",
      "updated_at": "2026-02-01T05:31:43Z"
    }
  }
  ```

  Reference: https://fleetdm.com/docs/rest-api/rest-api#get-hosts-managed-account-password
examples:
- name: 200 Default response
  request:
    method: GET
    url: '{{baseUrl}}/api/v1/fleet/hosts/:id/managed_account_password'
    params:
    - name: id
      value: ''
      type: path
      description: '**Required** The ID of the host to get the managed account password for.'
  response:
    status: 200
    statusText: OK
    body:
      type: json
      data: |-
        {
          "host_id": 8,
          "managed_account_password": {
            "password": "test-123",
            "updated_at": "2026-02-01T05:31:43Z"
          }
        }
    headers:
    - name: Content-Type
      value: application/json
