info:
  name: Get host by identifier
  type: http
  seq: 5
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/hosts/identifier/:identifier'
  auth: inherit
  params:
  - name: identifier
    value: ''
    type: path
    description: '**Required**. The host''s `hostname`, `uuid`, or `hardware_serial`.'
  - name: exclude_software
    value: ''
    type: query
    disabled: true
    description: If `true`, the response will not include a list of installed software for the host.
  - name: exclude_fleet_maintained_policies
    value: ''
    type: query
    disabled: true
    description: If `true`, will omit Fleet-maintained policies from the policies list.
docs: "Returns the information of the host specified using the `hostname`, `uuid`, or `hardware_serial` as an identifier.\n\
  \n`GET /api/v1/fleet/hosts/identifier/:identifier`\n\n> If you're hitting this endpoint often (e.g. every hour)\
  \ for a large number of hosts (e.g. 1k+) the best practice is to set the `exclude_software` to `true` to prevent\
  \ overloading the Fleet server.\n\nIf `hostname` is specified when there is more than one host with the same hostname,\
  \ the endpoint returns the first matching host. \n\n> In Fleet, hostnames are fully qualified domain names (FQDNs).\
  \ `hostname` (e.g. johns-macbook-air.local) is **not** the same as `display_name` (e.g. John's MacBook Air).\n\
  \n> Note: GitOps users don't have host read access. For them, this endpoint returns the host's `id` and nothing\
  \ else, rather than an error like [Get host](#get-host) does.\n\n\n#### Parameters\n\n| Name       | Type    \
  \          | In   | Description                                                        |\n| ---------- | -----------------\
  \ | ---- | ------------------------------------------------------------------ |\n| identifier | string | path\
  \ | **Required**. The host's `hostname`, `uuid`, or `hardware_serial`. |\n| exclude_software | boolean | query\
  \ | If `true`, the response will not include a list of installed software for the host. |\n| exclude_fleet_maintained_policies\
  \ | boolean | query | If `true`, will omit Fleet-maintained policies from the policies list. |\n\n\n#### Example\
  \ (macOS)\n\n`GET /api/v1/fleet/hosts/identifier/392547dc-0000-0000-a87a-d701ff75bc65`\n\n##### Default response\n\
