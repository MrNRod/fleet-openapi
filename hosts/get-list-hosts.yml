info:
  name: List hosts
  type: http
  seq: 1
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/hosts'
  auth: inherit
  params:
  - name: page
    value: ''
    type: query
    disabled: true
    description: Page number of the results to fetch.
  - name: per_page
    value: ''
    type: query
    disabled: true
    description: Results per page.
  - name: order_key
    value: ''
    type: query
    disabled: true
    description: What to order results by. Can be any column in the hosts table.
  - name: after
    value: ''
    type: query
    disabled: true
    description: The value to get results after. This needs `order_key` defined, as that's the column that would
      be used. **Note:** Use `page` instead of `after`
  - name: order_direction
    value: ''
    type: query
    disabled: true
    description: '**Requires `order_key`**. The direction of the order given the order key. Options include `"asc"`
      and `"desc"`. Default is `"asc"`.'
  - name: status
    value: ''
    type: query
    disabled: true
    description: Indicates the status of the hosts to return. Can either be 'new', 'online', 'offline', 'mia', 'missing'
      or 'enrolled'. 'enrolled' returns every host except those pending MDM enrollment.
  - name: query
    value: ''
    type: query
    disabled: true
    description: Search query keywords. Searchable fields include `hostname`, `hardware_serial`, `uuid`, `ipv4`,
      and end user email addresses.
  - name: additional_info_filters
    value: ''
    type: query
    disabled: true
    description: A comma-delimited list of fields to include in each host's `additional` object. This query is populated
      by the `additional_queries` in the `features` section of the configuration YAML.
  - name: fleet_id
    value: ''
    type: query
    disabled: true
    description: _Available in Fleet Premium_. Filters to only include hosts in the specified fleet. Use `0` to
      filter by "Unassigned" hosts.
  - name: policy_id
    value: ''
    type: query
    disabled: true
    description: The ID of the policy to filter hosts by.
  - name: policy_response
    value: ''
    type: query
    disabled: true
    description: '**Requires `policy_id`**. Valid options are ''passing'' or ''failing''.'
  - name: software_version_id
    value: ''
    type: query
    disabled: true
    description: The ID of the software version to filter hosts by.
  - name: software_title_id
    value: ''
    type: query
    disabled: true
    description: The ID of the software title to filter hosts by.
  - name: software_status
    value: ''
    type: query
    disabled: true
    description: 'The status of the software install to filter hosts by. One of: `pending_install`, `failed_install`,
      `installed`, `pending_uninstall`, `failed_uninstall`, `pending`, or `failed`. Mutually exclusive with `software_version_id`,
      and must be supplied if `software_title_id` is set.'
  - name: os_version_id
    value: ''
    type: query
    disabled: true
    description: The ID of the operating system version to filter hosts by.
  - name: os_name
    value: ''
    type: query
    disabled: true
    description: The name of the operating system to filter hosts by. `os_version` must also be specified with `os_name`.
      See note below for filtering Windows hosts.
  - name: os_version
    value: ''
    type: query
    disabled: true
    description: The version of the operating system to filter hosts by. `os_name` must also be specified with `os_version`.
      See note below for filtering Windows hosts.
  - name: vulnerability
    value: ''
    type: query
    disabled: true
    description: The cve to filter hosts by (including "cve-" prefix, case-insensitive).
  - name: device_mapping
    value: ''
    type: query
    disabled: true
    description: Indicates whether `device_mapping` should be included for each host.
  - name: mdm_id
    value: ''
    type: query
    disabled: true
    description: The ID of the _mobile device management_ (MDM) solution to filter hosts by (that is, filter hosts
      that use a specific MDM provider and URL).
  - name: mdm_name
    value: ''
    type: query
    disabled: true
    description: The name of the _mobile device management_ (MDM) solution to filter hosts by (that is, filter hosts
      that use a specific MDM provider).
  - name: mdm_enrollment_status
    value: ''
    type: query
    disabled: true
    description: The _mobile device management_ (MDM) enrollment status to filter hosts by. Valid options are 'manual',
      'manual-personal', 'automatic', 'enrolled', 'pending', or 'unenrolled'. 'pending' only includes Apple (macOS,
      iOS, iPadOS) hosts in Apple Business (AB) that are not yet enrolled to Fleet.
  - name: connected_to_fleet
    value: ''
    type: query
    disabled: true
    description: Filter hosts that are talking to this Fleet server for MDM features. In rare cases, hosts can be
      enrolled to one Fleet server but talk to a different Fleet server for MDM features. In this case, the value
      would be `false`. Always `false` for Linux hosts.
  - name: macos_settings
    value: ''
    type: query
    disabled: true
    description: 'Filters the hosts by the status of the _mobile device management_ (MDM) profiles applied to hosts.
      Valid options are ''verified'', ''verifying'', ''pending'', or ''failed''. **Note: If this filter is used
      in Fleet Premium without a fleet ID filter, the results include only "Unassigned" hosts.**'
  - name: munki_issue_id
    value: ''
    type: query
    disabled: true
    description: The ID of the _munki issue_ (a Munki-reported error or warning message) to filter hosts by (that
      is, filter hosts that are affected by that corresponding error or warning message).
  - name: low_disk_space
    value: ''
    type: query
    disabled: true
    description: _Available in Fleet Premium_. Filters the hosts to only include hosts with less GB of disk space
      available than this value. Must be a number between 1-100.
  - name: disable_failing_policies
    value: ''
    type: query
    disabled: true
    description: If `true`, hosts will return failing policies as 0 regardless of whether there are any that failed
      for the host. This is meant to be used when increased performance is needed in exchange for the extra information.
  - name: macos_settings_disk_encryption
    value: ''
    type: query
    disabled: true
    description: Filters the hosts by disk encryption status. Valid options are 'verified', 'verifying', 'action_required',
      'enforcing', 'failed', or 'removing_enforcement'.
  - name: bootstrap_package
    value: ''
    type: query
    disabled: true
    description: _Available in Fleet Premium_. Filters the hosts by the status of the MDM bootstrap package on the
      host. Valid options are 'installed', 'pending', or 'failed'.
  - name: os_settings
    value: ''
    type: query
    disabled: true
    description: 'Filters the hosts by the status of the operating system settings applied to the hosts. Valid options
      are ''verified'', ''verifying'', ''pending'', or ''failed''. **Note: If this filter is used in Fleet Premium
      without a fleet ID filter, the results include only "Unassigned" hosts.**'
  - name: os_settings_disk_encryption
    value: ''
    type: query
    disabled: true
    description: 'Filters the hosts by disk encryption status. Valid options are ''verified'', ''verifying'', ''action_required'',
      ''enforcing'', ''failed'', or ''removing_enforcement''.  **Note: If this filter is used in Fleet Premium without
      a fleet ID filter, the results include only "Unassigned" hosts.**'
  - name: populate_software
    value: ''
    type: query
    disabled: true
    description: If `false` (or omitted), omits installed software details for each host. If `"without_vulnerability_details"`,
      include a list of installed software for each host, including which CVEs apply to the installed software versions.
      `true` adds vulnerability description, CVSS score, and other details when using Fleet Premium. See notes above
      on performance.
  - name: populate_policies
    value: ''
    type: query
    disabled: true
    description: If `true`, the response will include policy data for each host, including Fleet-maintained policies.
  - name: populate_users
    value: ''
    type: query
    disabled: true
    description: If `true`, the response will include user data for each host.
  - name: populate_end_users
    value: ''
    type: query
    disabled: true
    description: If `true`, the response will include end user data for each host, including identity provider (IdP)
      details and other emails.
  - name: populate_labels
    value: ''
    type: query
    disabled: true
    description: If `true`, the response will include labels for each host.
  - name: include_device_status
    value: ''
    type: query
    disabled: true
    description: If `true`, the response will include lock and wipe status (`mdm.device_status`) and `mdm.pending_action`
      information for each host.
  - name: profile_uuid
    value: ''
    type: query
    disabled: true
    description: '**Requires `profile_status`**. The UUID of the profile to download.'
  - name: profile_status
    value: ''
    type: query
    disabled: true
    description: '**Requires `profile_uuid`**. Valid options are ''verified'', ''verifying'', ''pending'', or ''failed''.'
  - name: dep_profile_error
    value: ''
    type: query
    disabled: true
    description: 'If `true`, the response will only include Apple MDM hosts with DEP profile assignment errors(`mdm.dep_profile_error:
      true`).'
  - name: dep_assign_profile_response
    value: ''
    type: query
    disabled: true
    description: Filters the hosts by DEP profile assignment status. Valid options are 'SUCCESS', 'FAILED', 'THROTTLED'
      or 'NOT_ACCESSIBLE'. Only Apple hosts which are, or were assigned to Fleet in ABM will be returned.
docs: |-
  `GET /api/v1/fleet/hosts`

  > `populate_software` returns a lot of data per host when set, and drastically more data when set to `true` on Fleet Premium. If you need vulnerability details for a large number of hosts, consider setting `populate_software` to `without_vulnerability_details` and pulling vulnerability details from the [Get vulnerability](#get-vulnerability) endpoint, as this returns details once per vulnerability rather than once per vulnerability per host.

  > `populate_end_users` runs several extra database queries for each host in the response. Note that `other_emails` is built from the same data as the `device_mapping` parameter, so there's no need to request both.

  > Searching with `query` and setting `device_mapping=true` or `populate_end_users=true` are each expensive, and combining them is more so. If you're using these, the best practice is to reduce the number of results returned using `per_page=50`, to prevent overloading the Fleet server.

  > `group_tag` is the Windows Autopilot group tag, and is only returned for hosts synced from a tenant's Autopilot registry. See [Connect Fleet to Microsoft Graph](https://fleetdm.com/guides/windows-mdm-setup#connect-fleet-to-microsoft-graph).

  #### Parameters

  | Name                    | Type    | In    | Description                                                                                                                                                                                                                                                                                                                                 |
  | ----------------------- | ------- | ----- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | page                    | integer | query | Page number of the results to fetch.                                                                                                                                                                                                                                                                                                        |
  | per_page                | integer | query | Results per page.                                                                                                                                                                                                                                                                                                                           |
  | order_key               | string  | query | What to order results by. Can be any column in the hosts table.                                                                                                                                                                                                                                                                             |
  | after                   | string  | query | The value to get results after. This needs `order_key` defined, as that's the column that would be used. **Note:** Use `page` instead of `after`                                                                                                                                                                                                                                    |
  | order_direction         | string  | query | **Requires `order_key`**. The direction of the order given the order key. Options include `"asc"` and `"desc"`. Default is `"asc"`.                                                                                                                                                                                                               |
  | status                  | string  | query | Indicates the status of the hosts to return. Can either be 'new', 'online', 'offline', 'mia', 'missing' or 'enrolled'. 'enrolled' returns every host except those pending MDM enrollment.                                                                                                                                                                                                                                  |
  | query                   | string  | query | Search query keywords. Searchable fields include `hostname`, `hardware_serial`, `uuid`, `ipv4`, and end user email addresses. |
  | additional_info_filters | string  | query | A comma-delimited list of fields to include in each host's `additional` object. This query is populated by the `additional_queries` in the `features` section of the configuration YAML.                                              |
  | fleet_id                 | integer | query | _Available in Fleet Premium_. Filters to only include hosts in the specified fleet. Use `0` to filter by "Unassigned" hosts.                                                                                                                                                                                                                                                |
  | policy_id               | integer | query | The ID of the policy to filter hosts by.                                                                                                                                                                                                                                                                                                    |
  | policy_response         | string  | query | **Requires `policy_id`**. Valid options are 'passing' or 'failing'.                                                                                                                                                                                                                                       |
  | software_version_id     | integer | query | The ID of the software version to filter hosts by.                                                                                                                                                                                                                                                                                                  |
  | software_title_id       | integer | query | The ID of the software title to filter hosts by.                                                                                                                                                                                                                                                                                                  |
  | software_status       | string | query | The status of the software install to filter hosts by. One of: `pending_install`, `failed_install`, `installed`, `pending_uninstall`, `failed_uninstall`, `pending`, or `failed`. Mutually exclusive with `software_version_id`, and must be supplied if `software_title_id` is set.   |
  | os_version_id | integer | query | The ID of the operating system version to filter hosts by. |
  | os_name                 | string  | query | The name of the operating system to filter hosts by. `os_version` must also be specified with `os_name`. See note below for filtering Windows hosts.                                                                                                                                                                                                                                     |
  | os_version              | string  | query | The version of the operating system to filter hosts by. `os_name` must also be specified with `os_version`. See note below for filtering Windows hosts.                                                                                                                                                                                                                                  |
  | vulnerability           | string  | query | The cve to filter hosts by (including "cve-" prefix, case-insensitive).                                                                                                                                                                                                                                                                     |
  | device_mapping          | boolean | query | Indicates whether `device_mapping` should be included for each host. |
  | mdm_id                  | integer | query | The ID of the _mobile device management_ (MDM) solution to filter hosts by (that is, filter hosts that use a specific MDM provider and URL).                                                                                                                                                                                                |
  | mdm_name                | string  | query | The name of the _mobile device management_ (MDM) solution to filter hosts by (that is, filter hosts that use a specific MDM provider).                                                                                                                                                                                                |
  | mdm_enrollment_status   | string  | query | The _mobile device management_ (MDM) enrollment status to filter hosts by. Valid options are 'manual', 'manual-personal', 'automatic', 'enrolled', 'pending', or 'unenrolled'. 'pending' only includes Apple (macOS, iOS, iPadOS) hosts in Apple Business (AB) that are not yet enrolled to Fleet. |
  | connected_to_fleet   | boolean  | query | Filter hosts that are talking to this Fleet server for MDM features. In rare cases, hosts can be enrolled to one Fleet server but talk to a different Fleet server for MDM features. In this case, the value would be `false`. Always `false` for Linux hosts.                                                                                                                           |
  | macos_settings          | string  | query | Filters the hosts by the status of the _mobile device management_ (MDM) profiles applied to hosts. Valid options are 'verified', 'verifying', 'pending', or 'failed'. **Note: If this filter is used in Fleet Premium without a fleet ID filter, the results include only "Unassigned" hosts.**                                                                                                                                                                                                             |
  | munki_issue_id          | integer | query | The ID of the _munki issue_ (a Munki-reported error or warning message) to filter hosts by (that is, filter hosts that are affected by that corresponding error or warning message).                                                                                                                                                        |
  | low_disk_space          | integer | query | _Available in Fleet Premium_. Filters the hosts to only include hosts with less GB of disk space available than this value. Must be a number between 1-100.                                                                                                                                                                                  |
  | disable_failing_policies| boolean | query | If `true`, hosts will return failing policies as 0 regardless of whether there are any that failed for the host. This is meant to be used when increased performance is needed in exchange for the extra information.                                                                                                                       |
  | macos_settings_disk_encryption | string | query | Filters the hosts by disk encryption status. Valid options are 'verified', 'verifying', 'action_required', 'enforcing', 'failed', or 'removing_enforcement'. |
  | bootstrap_package       | string | query | _Available in Fleet Premium_. Filters the hosts by the status of the MDM bootstrap package on the host. Valid options are 'installed', 'pending', or 'failed'. |
  | os_settings          | string  | query | Filters the hosts by the status of the operating system settings applied to the hosts. Valid options are 'verified', 'verifying', 'pending', or 'failed'. **Note: If this filter is used in Fleet Premium without a fleet ID filter, the results include only "Unassigned" hosts.** |
  | os_settings_disk_encryption | string | query | Filters the hosts by disk encryption status. Valid options are 'verified', 'verifying', 'action_required', 'enforcing', 'failed', or 'removing_enforcement'.  **Note: If this filter is used in Fleet Premium without a fleet ID filter, the results include only "Unassigned" hosts.** |
  | populate_software     | string | query | If `false` (or omitted), omits installed software details for each host. If `"without_vulnerability_details"`, include a list of installed software for each host, including which CVEs apply to the installed software versions. `true` adds vulnerability description, CVSS score, and other details when using Fleet Premium. See notes above on performance. |
  | populate_policies     | boolean | query | If `true`, the response will include policy data for each host, including Fleet-maintained policies. |
  | populate_users     | boolean | query | If `true`, the response will include user data for each host. |
  | populate_end_users     | boolean | query | If `true`, the response will include end user data for each host, including identity provider (IdP) details and other emails. |
  | populate_labels     | boolean | query | If `true`, the response will include labels for each host. |
  | include_device_status     | boolean | query | If `true`, the response will include lock and wipe status (`mdm.device_status`) and `mdm.pending_action` information for each host. |
  | profile_uuid | string | query |  **Requires `profile_status`**. The UUID of the profile to download. |
  | profile_status | string | query | **Requires `profile_uuid`**. Valid options are 'verified', 'verifying', 'pending', or 'failed'. |
  | dep_profile_error | boolean | query | If `true`, the response will only include Apple MDM hosts with DEP profile assignment errors(`mdm.dep_profile_error: true`). |
  | dep_assign_profile_response | string | query | Filters the hosts by DEP profile assignment status. Valid options are 'SUCCESS', 'FAILED', 'THROTTLED' or 'NOT_ACCESSIBLE'. Only Apple hosts which are, or were assigned to Fleet in ABM will be returned. |

  > `software_id` is deprecated as of Fleet 4.42. It is maintained for backwards compatibility. Please use the `software_version_id` instead.

  If `software_title_id` is specified, an additional top-level key `"software_title"` is returned with the software title object corresponding to the `software_title_id`. See [List software](#list-software) response payload for details about this object.

  If `software_version_id` is specified, an additional top-level key `"software"` is returned with the software object corresponding to the `software_version_id`. See [List software versions](#list-software-versions) response payload for details about this object.

  If `additional_info_filters` is not specified, no `additional` information will be returned.

  If `mdm_id` is specified, an additional top-level key `"mobile_device_management_solution"` is returned with the information corresponding to the `mdm_id`.

  If `mdm_id`, `mdm_name`, `mdm_enrollment_status`, `os_settings`, or `os_settings_disk_encryption` is specified, then Windows Servers are excluded from the results.

  If `munki_issue_id` is specified, an additional top-level key `munki_issue` is returned with the information corresponding to the `munki_issue_id`.

  If `after` is being used with `created_at` or `updated_at`, the table must be specified in `order_key`. Those columns become `h.created_at` and `h.updated_at`.

  If `include_device_status` is set to `true`, `device_status` and `pending_action` are included in the MDM information for each host. `device_status` indicates the current lock/wipe state of the device with possible values: `unlocked`, `locked`, `locking`, `unlocking`, `wiped`, `wiping`. `pending_action` indicates if a lock, unlock, or wipe command is pending with possible values: `lock`, `unlock`, `wipe`, or an empty string (no pending action).

  To filter hosts by platform (macOS, Windows, Linux), use the ["List label's hosts" API endpoint](https://fleetdm.com/docs/rest-api/rest-api#list-labels-hosts). Find the label ID by filtering in the **Hosts** page of the Fleet UI and copying the ID from the URL (for example: `7` for `/hosts/manage/labels/7`).

  To filter Windows hosts using `os_name` and `os_version`, set `os_name` to the full operating system name without the build number, and set `os_version` to the build number. For example, if the **Operating system** field in host details shows `Windows 11 Home Single Language 23H2 10.0.22631.5335`, query with `os_name=Microsoft Windows 11 Home Single Language 23H2` and `os_version=10.0.22631.5335`. For macOS and Linux hosts, `os_name` is the OS name (for example, `macOS` or `Ubuntu`) and `os_version` is the version number (for example, `15.2` or `20.04.3 LTS`).

  #### Example

  `GET /api/v1/fleet/hosts?page=0&per_page=100&order_key=hostname&query=2ce&populate_software=true&populate_policies=true&populate_users=true&populate_end_users=true&populate_labels=true&include_device_status=true`

  ##### Request query parameters

  ```json
  {
    "page": 0,
    "per_page": 100,
    "order_key": "hostname"
  }
  ```

