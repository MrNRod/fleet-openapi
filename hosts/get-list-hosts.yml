  > Note: the response above assumes a [GeoIP database is configured](https://fleetdm.com/docs/deploying/configuration#geoip), otherwise the `geolocation` object won't be included.

  > Note: `disk_encryption_enabled` is omitted when Fleet doesn't know the host's disk encryption status, such as when the host hasn't reported it yet. It's also omitted for Linux hosts that report their root volume as unencrypted, because Fleet can't confirm that a Linux host's disk is unencrypted.

  Response payload with the `mdm_id` filter provided:

  ```json
  {
    "hosts": [...],
    "mobile_device_management_solution": {
      "server_url": "http://some.url/mdm",
      "name": "MDM Vendor Name",
      "id": 999
    }
  }
  ```

  Response payload with the `munki_issue_id` filter provided:

  ```json
  {
    "hosts": [...],
    "munki_issue": {
      "id": 1,
      "name": "Could not retrieve managed install primary manifest",
      "type": "error"
    }
  }
  ```

  Reference: https://fleetdm.com/docs/rest-api/rest-api#list-hosts
examples:
- name: 200 Default response
  request:
    method: GET
    url: '{{baseUrl}}/api/v1/fleet/hosts'
    params:
    - name: page
      value: ''
      type: query
      disabled: true
      description: Page number of the results to fetch.
    - name: per_page
      value: ''
      type: query
      disabled: true
      description: Results per page.
    - name: order_key
      value: ''
      type: query
      disabled: true
      description: What to order results by. Can be any column in the hosts table.
    - name: after
      value: ''
      type: query
      disabled: true
      description: The value to get results after. This needs `order_key` defined, as that's the column that would
        be used. **Note:** Use `page` instead of `after`
    - name: order_direction
      value: ''
      type: query
      disabled: true
      description: '**Requires `order_key`**. The direction of the order given the order key. Options include `"asc"`
        and `"desc"`. Default is `"asc"`.'
    - name: status
      value: ''
      type: query
      disabled: true
      description: Indicates the status of the hosts to return. Can either be 'new', 'online', 'offline', 'mia',
        'missing' or 'enrolled'. 'enrolled' returns every host except those pending MDM enrollment.
    - name: query
      value: ''
      type: query
      disabled: true
      description: Search query keywords. Searchable fields include `hostname`, `hardware_serial`, `uuid`, `ipv4`,
        and end user email addresses.
    - name: additional_info_filters
      value: ''
      type: query
      disabled: true
      description: A comma-delimited list of fields to include in each host's `additional` object. This query is
        populated by the `additional_queries` in the `features` section of the configuration YAML.
    - name: fleet_id
      value: ''
      type: query
      disabled: true
      description: _Available in Fleet Premium_. Filters to only include hosts in the specified fleet. Use `0` to
        filter by "Unassigned" hosts.
    - name: policy_id
      value: ''
      type: query
      disabled: true
      description: The ID of the policy to filter hosts by.
    - name: policy_response
      value: ''
      type: query
      disabled: true
      description: '**Requires `policy_id`**. Valid options are ''passing'' or ''failing''.'
    - name: software_version_id
      value: ''
      type: query
      disabled: true
      description: The ID of the software version to filter hosts by.
    - name: software_title_id
      value: ''
      type: query
      disabled: true
      description: The ID of the software title to filter hosts by.
    - name: software_status
      value: ''
      type: query
      disabled: true
      description: 'The status of the software install to filter hosts by. One of: `pending_install`, `failed_install`,
        `installed`, `pending_uninstall`, `failed_uninstall`, `pending`, or `failed`. Mutually exclusive with `software_version_id`,
        and must be supplied if `software_title_id` is set.'
    - name: os_version_id
      value: ''
      type: query
      disabled: true
      description: The ID of the operating system version to filter hosts by.
    - name: os_name
      value: ''
      type: query
      disabled: true
      description: The name of the operating system to filter hosts by. `os_version` must also be specified with
        `os_name`. See note below for filtering Windows hosts.
    - name: os_version
      value: ''
      type: query
      disabled: true
      description: The version of the operating system to filter hosts by. `os_name` must also be specified with
        `os_version`. See note below for filtering Windows hosts.
    - name: vulnerability
      value: ''
      type: query
      disabled: true
      description: The cve to filter hosts by (including "cve-" prefix, case-insensitive).
    - name: device_mapping
      value: ''
      type: query
      disabled: true
      description: Indicates whether `device_mapping` should be included for each host.
    - name: mdm_id
      value: ''
      type: query
      disabled: true
      description: The ID of the _mobile device management_ (MDM) solution to filter hosts by (that is, filter hosts
        that use a specific MDM provider and URL).
    - name: mdm_name
      value: ''
      type: query
      disabled: true
      description: The name of the _mobile device management_ (MDM) solution to filter hosts by (that is, filter
        hosts that use a specific MDM provider).
    - name: mdm_enrollment_status
      value: ''
      type: query
      disabled: true
      description: The _mobile device management_ (MDM) enrollment status to filter hosts by. Valid options are
        'manual', 'manual-personal', 'automatic', 'enrolled', 'pending', or 'unenrolled'. 'pending' only includes
        Apple (macOS, iOS, iPadOS) hosts in Apple Business (AB) that are not yet enrolled to Fleet.
    - name: connected_to_fleet
      value: ''
      type: query
      disabled: true
      description: Filter hosts that are talking to this Fleet server for MDM features. In rare cases, hosts can
        be enrolled to one Fleet server but talk to a different Fleet server for MDM features. In this case, the
        value would be `false`. Always `false` for Linux hosts.
    - name: macos_settings
      value: ''
      type: query
      disabled: true
      description: 'Filters the hosts by the status of the _mobile device management_ (MDM) profiles applied to
        hosts. Valid options are ''verified'', ''verifying'', ''pending'', or ''failed''. **Note: If this filter
        is used in Fleet Premium without a fleet ID filter, the results include only "Unassigned" hosts.**'
    - name: munki_issue_id
      value: ''
      type: query
      disabled: true
      description: The ID of the _munki issue_ (a Munki-reported error or warning message) to filter hosts by (that
        is, filter hosts that are affected by that corresponding error or warning message).
    - name: low_disk_space
      value: ''
      type: query
      disabled: true
      description: _Available in Fleet Premium_. Filters the hosts to only include hosts with less GB of disk space
        available than this value. Must be a number between 1-100.
    - name: disable_failing_policies
      value: ''
      type: query
      disabled: true
      description: If `true`, hosts will return failing policies as 0 regardless of whether there are any that failed
        for the host. This is meant to be used when increased performance is needed in exchange for the extra information.
    - name: macos_settings_disk_encryption
      value: ''
      type: query
      disabled: true
      description: Filters the hosts by disk encryption status. Valid options are 'verified', 'verifying', 'action_required',
        'enforcing', 'failed', or 'removing_enforcement'.
    - name: bootstrap_package
      value: ''
      type: query
      disabled: true
      description: _Available in Fleet Premium_. Filters the hosts by the status of the MDM bootstrap package on
        the host. Valid options are 'installed', 'pending', or 'failed'.
    - name: os_settings
      value: ''
      type: query
      disabled: true
      description: 'Filters the hosts by the status of the operating system settings applied to the hosts. Valid
        options are ''verified'', ''verifying'', ''pending'', or ''failed''. **Note: If this filter is used in Fleet
        Premium without a fleet ID filter, the results include only "Unassigned" hosts.**'
    - name: os_settings_disk_encryption
      value: ''
      type: query
      disabled: true
      description: 'Filters the hosts by disk encryption status. Valid options are ''verified'', ''verifying'',
        ''action_required'', ''enforcing'', ''failed'', or ''removing_enforcement''.  **Note: If this filter is
        used in Fleet Premium without a fleet ID filter, the results include only "Unassigned" hosts.**'
    - name: populate_software
      value: ''
      type: query
      disabled: true
      description: If `false` (or omitted), omits installed software details for each host. If `"without_vulnerability_details"`,
        include a list of installed software for each host, including which CVEs apply to the installed software
        versions. `true` adds vulnerability description, CVSS score, and other details when using Fleet Premium.
        See notes above on performance.
    - name: populate_policies
      value: ''
      type: query
      disabled: true
      description: If `true`, the response will include policy data for each host, including Fleet-maintained policies.
    - name: populate_users
      value: ''
      type: query
      disabled: true
      description: If `true`, the response will include user data for each host.
    - name: populate_end_users
      value: ''
      type: query
      disabled: true
      description: If `true`, the response will include end user data for each host, including identity provider
        (IdP) details and other emails.
    - name: populate_labels
      value: ''
      type: query
      disabled: true
      description: If `true`, the response will include labels for each host.
    - name: include_device_status
      value: ''
      type: query
      disabled: true
      description: If `true`, the response will include lock and wipe status (`mdm.device_status`) and `mdm.pending_action`
        information for each host.
    - name: profile_uuid
      value: ''
      type: query
      disabled: true
      description: '**Requires `profile_status`**. The UUID of the profile to download.'
    - name: profile_status
      value: ''
      type: query
      disabled: true
      description: '**Requires `profile_uuid`**. Valid options are ''verified'', ''verifying'', ''pending'', or
        ''failed''.'
    - name: dep_profile_error
      value: ''
      type: query
      disabled: true
      description: 'If `true`, the response will only include Apple MDM hosts with DEP profile assignment errors(`mdm.dep_profile_error:
        true`).'
    - name: dep_assign_profile_response
      value: ''
      type: query
      disabled: true
      description: Filters the hosts by DEP profile assignment status. Valid options are 'SUCCESS', 'FAILED', 'THROTTLED'
        or 'NOT_ACCESSIBLE'. Only Apple hosts which are, or were assigned to Fleet in ABM will be returned.
