info:
  name: Update hosts' fleet by filter
  type: http
  seq: 11
http:
  method: POST
  url: '{{baseUrl}}/api/v1/fleet/hosts/transfer/filter'
  auth: inherit
  body:
    type: json
    data: |-
      {
        "team_id": 1,
        "fleet_id": 1,
        "filters": {
          "status": "online",
          "team_id": 2,
          "fleet_id": 2
        }
      }
  headers:
  - name: Content-Type
    value: application/json
docs: |-
  _Available in Fleet Premium_

  `POST /api/v1/fleet/hosts/transfer/filter`

  #### Parameters

  | Name    | Type    | In   | Description                                                                                                                                                                                                                                                                                                                        |
  | ------- | ------- | ---- | ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | fleet_id | integer | body | **Required**. The ID of the fleet you'd like to assign the host(s) to. |
  | filters | object  | body | **Required**. See [filters](#filters)  |


  ##### Filters

  | Name                              | Type    | Description   |
  | ---------------------             | ------- | ----------------------------------------------------------------------------------- |
  | query                             | string  | Search query keywords. Searchable fields include `hostname`, `hardware_serial`, `uuid`, and `ipv4`. |
  | status                            | string  | Host status. Can either be `new`, `online`, `offline`, `mia` or `missing`. |
  | label_id                          | number  | ID of a label to filter by.  |
  | fleet_id                           | number  | ID of the fleet to filter by. |

  > Note: `label_id` and `status` filters cannot be used at the same time.


  #### Example

  `POST /api/v1/fleet/hosts/transfer/filter`

  ##### Request body

  ```json
  {
    "team_id": 1,
    "fleet_id": 1,
    "filters": {
      "status": "online",
      "team_id": 2,
      "fleet_id": 2,
    }
  }
  ```

  ##### Default response

  `Status: 200`

  Reference: https://fleetdm.com/docs/rest-api/rest-api#update-hosts-fleet-by-filter
examples:
- name: 200 Default response
  request:
    method: POST
    url: '{{baseUrl}}/api/v1/fleet/hosts/transfer/filter'
    body:
      type: json
      data: |-
        {
          "team_id": 1,
          "fleet_id": 1,
          "filters": {
            "status": "online",
            "team_id": 2,
            "fleet_id": 2
          }
        }
    headers:
    - name: Content-Type
      value: application/json
  response:
    status: 200
    statusText: OK
