info:
  name: Get host's OS settings (configuration profile)
  type: http
  seq: 28
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/hosts/:id/configuration_profiles'
  auth: inherit
  params:
  - name: id
    value: ''
    type: path
    description: '**Required**. The ID of the host'
docs: |-
  Requires Fleet's MDM properly [enabled and configured](https://fleetdm.com/docs/using-fleet/mdm-setup).

  Retrieves a list of the configuration profiles assigned to a host.

  `GET /api/v1/fleet/hosts/:id/configuration_profiles`

  #### Parameters

  | Name | Type    | In   | Description                      |
  | ---- | ------- | ---- | -------------------------------- |
  | id   | integer | path | **Required**. The ID of the host  |


  #### Example

  `GET /api/v1/fleet/hosts/8/configuration_profiles`

  ##### Default response

  `Status: 200`

  ```json
  {
    "host_id": 8,
    "profiles": [
      {
        "profile_uuid": "bc84dae7-396c-4e10-9d45-5768bce8b8bd",
        "team_id": 0,
        "fleet_id": 0,
        "name": "Example profile",
        "identifier": "com.example.profile",
        "created_at": "2023-03-31T00:00:00Z",
        "updated_at": "2023-03-31T00:00:00Z",
        "checksum": "dGVzdAo="
      }
    ]
  }
  ```

  Reference: https://fleetdm.com/docs/rest-api/rest-api#get-hosts-os-settings-configuration-profile
examples:
