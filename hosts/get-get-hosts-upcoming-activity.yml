info:
  name: Get host's upcoming activity
  type: http
  seq: 34
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/hosts/:id/activities/upcoming'
  auth: inherit
  params:
  - name: id
    value: ''
    type: path
    description: '**Required**. The host''s id.'
  - name: page
    value: ''
    type: query
    disabled: true
    description: Page number of the results to fetch.
  - name: per_page
    value: ''
    type: query
    disabled: true
    description: Results per page.
docs: |-
  `GET /api/v1/fleet/hosts/:id/activities/upcoming`

  #### Parameters

  | Name | Type    | In   | Description                  |
  | ---- | ------- | ---- | ---------------------------- |
  | id   | integer | path | **Required**. The host's id. |
  | page | integer | query | Page number of the results to fetch.|
  | per_page | integer | query | Results per page.|

  #### Example

  `GET /api/v1/fleet/hosts/12/activities/upcoming`

  ##### Default response

  `Status: 200`

