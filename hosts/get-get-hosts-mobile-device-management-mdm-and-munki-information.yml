info:
  name: Get host's mobile device management (MDM) and Munki information
  type: http
  seq: 19
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/hosts/:id/macadmins'
  auth: inherit
  params:
  - name: id
    value: ''
    type: path
    description: '**Required** The id of the host to get the details for'
docs: |-
  Retrieves a host's MDM enrollment status, MDM server URL, and Munki version.

  `GET /api/v1/fleet/hosts/:id/macadmins`

  #### Parameters

  | Name    | Type    | In   | Description                                                                                                                                                                                                                                                                                                                        |
  | ------- | ------- | ---- | -------------------------------------------------------------------------------- |
  | id      | integer | path | **Required** The id of the host to get the details for                           |

  #### Example

  `GET /api/v1/fleet/hosts/32/macadmins`

  ##### Default response

  `Status: 200`

  ```json
  {
    "macadmins": {
      "munki": {
        "version": "1.2.3"
      },
      "munki_issues": [
        {
          "id": 1,
          "name": "Could not retrieve managed install primary manifest",
          "type": "error",
          "created_at": "2022-08-01T05:09:44Z"
        },
        {
          "id": 2,
          "name": "Could not process item Figma for optional install. No pkginfo found in catalogs: release",
          "type": "warning",
          "created_at": "2022-08-01T05:09:44Z"
        }
      ],
      "mobile_device_management": {
        "enrollment_status": "On (automatic)",
        "server_url": "http://some.url/mdm",
        "name": "MDM Vendor Name",
        "id": 999
      }
    }
  }
  ```

  ---

  Reference: https://fleetdm.com/docs/rest-api/rest-api#get-hosts-mobile-device-management-mdm-and-munki-information
