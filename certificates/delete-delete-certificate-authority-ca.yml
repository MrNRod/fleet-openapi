info:
  name: Delete certificate authority (CA)
  type: http
  seq: 8
http:
  method: DELETE
  url: '{{baseUrl}}/api/v1/fleet/certificate_authorities/:id'
  auth: inherit
  params:
  - name: id
    value: ''
    type: path
    description: '**Required.** The certificate authority (CA) ID in Fleet. You can see your CAs IDs using the [List
      certificate authorities endpoint](#list-certificate-authorities-cas).'
docs: |-
  When the CA is deleted, the issued certificates will remain on existing hosts.

  `DELETE /api/v1/fleet/certificate_authorities/:id`

  #### Parameters

  | Name            | Type    | In   | Description                                                 |
  |---------------- |-------- |------|-------------------------------------------------------------|
  | id   | integer | path | **Required.** The certificate authority (CA) ID in Fleet. You can see your CAs IDs using the [List certificate authorities endpoint](#list-certificate-authorities-cas). |

  #### Example

  `DELETE /api/v1/fleet/certificate_authorities/1`

  ##### Default response

  `Status: 204`

  Reference: https://fleetdm.com/docs/rest-api/rest-api#delete-certificate-authority-ca
examples:
- name: 204 Default response
  request:
    method: DELETE
    url: '{{baseUrl}}/api/v1/fleet/certificate_authorities/:id'
    params:
    - name: id
      value: ''
      type: path
      description: '**Required.** The certificate authority (CA) ID in Fleet. You can see your CAs IDs using the
        [List certificate authorities endpoint](#list-certificate-authorities-cas).'
  response:
    status: 204
    statusText: No Content
