info:
  name: Get script result
  type: http
  seq: 2
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/scripts/results/:execution_id'
  auth: inherit
  params:
  - name: execution_id
    value: ''
    type: path
    description: '**Required**. The execution id of the script.'
docs: |-
  Gets the result of a script that was executed.

  `GET /api/v1/fleet/scripts/results/:execution_id`

  #### Parameters

  | Name         | Type   | In   | Description                                   |
  | ----         | ------ | ---- | --------------------------------------------  |
  | execution_id | string | path | **Required**. The execution id of the script. |

  #### Example

  `GET /api/v1/fleet/scripts/results/:execution_id`

  ##### Default response

  `Status: 200`

  ```json
  {
    "script_contents": "echo 'hello'",
    "exit_code": 0,
    "output": "hello",
    "message": "",
    "hostname": "Test Host",
    "host_timeout": false,
    "host_id": 1,
    "execution_id": "e797d6c6-3aae-11ee-be56-0242ac120002",
    "runtime": 20,
    "created_at": "2024-09-11T20:30:24Z"
  }
  ```

  > Note: `exit_code` can be `null` if Fleet hasn't heard back from the host yet.

  > Note: `created_at` is the creation timestamp of the script execution request.

  Reference: https://fleetdm.com/docs/rest-api/rest-api#get-script-result
examples:
- name: 200 Default response
  request:
    method: GET
    url: '{{baseUrl}}/api/v1/fleet/scripts/results/:execution_id'
    params:
    - name: execution_id
      value: ''
      type: path
      description: '**Required**. The execution id of the script.'
  response:
    status: 200
    statusText: OK
    body:
      type: json
      data: |-
        {
          "script_contents": "echo 'hello'",
          "exit_code": 0,
          "output": "hello",
          "message": "",
          "hostname": "Test Host",
          "host_timeout": false,
          "host_id": 1,
          "execution_id": "e797d6c6-3aae-11ee-be56-0242ac120002",
          "runtime": 20,
          "created_at": "2024-09-11T20:30:24Z"
        }
    headers:
    - name: Content-Type
      value: application/json
