info:
  name: Update script
  type: http
  seq: 9
http:
  method: PATCH
  url: '{{baseUrl}}/api/v1/fleet/scripts/:id'
  auth: inherit
  params:
  - name: id
    value: ''
    type: path
    description: '**Required**. The ID of the script to modify.'
  body:
    type: multipart-form
    data:
    - name: script
      value: []
      description: '**Required**. The file containing the script. Filename will be ignored.'
      disabled: false
      type: file
docs: |-
  Modifies an existing script.

  > You need to send a request of type `multipart/form-data`.

  `PATCH /api/v1/fleet/scripts/:id`


  #### Parameters

  | Name            | Type    | In   | Description                                           |
  | ----            | ------- | ---- | --------------------------------------------          |
  | id              | integer | path | **Required**. The ID of the script to modify. |
  | script          | file    | body | **Required**. The file containing the script. Filename will be ignored. |

  #### Example

  `PATCH /api/v1/fleet/scripts/1`

  ##### Request body

  ```http
  script="myscript.sh"
  ```

  ##### Default response

  `Status: 200`

  ```json
  {
    "id": 1,
    "team_id": null,
    "name": "script_1.sh",
    "created_at": "2023-07-30T13:41:07Z",
    "updated_at": "2023-07-30T13:41:07Z"
  }
  ```

  Reference: https://fleetdm.com/docs/rest-api/rest-api#update-script
examples:
- name: 200 Default response
  request:
    method: PATCH
    url: '{{baseUrl}}/api/v1/fleet/scripts/:id'
    params:
    - name: id
      value: ''
      type: path
      description: '**Required**. The ID of the script to modify.'
    body:
      type: multipart-form
      data:
      - name: script
        value: []
        description: '**Required**. The file containing the script. Filename will be ignored.'
        disabled: false
        type: file
  response:
    status: 200
    statusText: OK
    body:
      type: json
      data: |-
        {
          "id": 1,
          "team_id": null,
          "name": "script_1.sh",
          "created_at": "2023-07-30T13:41:07Z",
          "updated_at": "2023-07-30T13:41:07Z"
        }
    headers:
    - name: Content-Type
      value: application/json
