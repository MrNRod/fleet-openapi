info:
  name: Get or download script
  type: http
  seq: 13
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/scripts/:id'
  auth: inherit
  params:
  - name: id
    value: ''
    type: path
    description: '**Required.** The desired script''s ID.'
  - name: alt
    value: ''
    type: query
    disabled: true
    description: If specified and set to "media", downloads the script's contents.
docs: |-
  `GET /api/v1/fleet/scripts/:id`

  #### Parameters

  | Name | Type    | In    | Description                                                       |
  | ---- | ------- | ----  | -------------------------------------                             |
  | id   | integer | path  | **Required.** The desired script's ID.                            |
  | alt  | string  | query | If specified and set to "media", downloads the script's contents. |

  #### Example (get script)

  `GET /api/v1/fleet/scripts/123`

  ##### Default response

  `Status: 200`

  ```json
  {
    "id": 123,
    "team_id": null,
    "name": "script_1.sh",
    "created_at": "2023-07-30T13:41:07Z",
    "updated_at": "2023-07-30T13:41:07Z"
  }

  ```

  #### Example (download script)

  `GET /api/v1/fleet/scripts/123?alt=media`

  ##### Example response headers

  ```http
  Content-Length: 13
  Content-Type: application/octet-stream
  Content-Disposition: attachment;filename="2023-09-27 script_1.sh"
  ```

  ###### Example response body

  `Status: 200`

  ```
  echo "hello"
  ```

  Reference: https://fleetdm.com/docs/rest-api/rest-api#get-or-download-script
