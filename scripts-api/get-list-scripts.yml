info:
  name: List scripts
  type: http
  seq: 11
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/scripts'
  auth: inherit
  params:
  - name: fleet_id
    value: ''
    type: query
    disabled: true
    description: _Available in Fleet Premium_. The ID of the fleet to filter scripts by. If not specified, it will
      filter only scripts that are available for "Unassigned" hosts.
  - name: page
    value: ''
    type: query
    disabled: true
    description: Page number of the results to fetch.
  - name: per_page
    value: ''
    type: query
    disabled: true
    description: Results per page.
  - name: order_key
    value: ''
    type: query
    disabled: true
    description: What to order results by. Can be ordered by `id`, `name`, `created_at`, or `updated_at`.
  - name: order_direction
    value: ''
    type: query
    disabled: true
    description: '**Requires `order_key`**. The direction of the order given the order key. Options include `"asc"`
      and `"desc"`. Default is `"asc"`.'
  - name: after
    value: ''
    type: query
    disabled: true
    description: The value to get results after. This needs `order_key` defined, as that's the column that would
      be used.
docs: |-
  `GET /api/v1/fleet/scripts`

  #### Parameters

  | Name            | Type    | In    | Description                                                                                                                   |
  | --------------- | ------- | ----- | ----------------------------------------------------------------------------------------------------------------------------- |
  | fleet_id         | integer | query | _Available in Fleet Premium_. The ID of the fleet to filter scripts by. If not specified, it will filter only scripts that are available for "Unassigned" hosts. |
  | page            | integer | query | Page number of the results to fetch.                                                                                          |
  | per_page        | integer | query | Results per page.                                                                                                             |
  | order_key       | string  | query | What to order results by. Can be ordered by `id`, `name`, `created_at`, or `updated_at`. |
  | order_direction | string  | query | **Requires `order_key`**. The direction of the order given the order key. Options include `"asc"` and `"desc"`. Default is `"asc"`. |
  | after           | string  | query | The value to get results after. This needs `order_key` defined, as that's the column that would be used. |

  #### Example

  `GET /api/v1/fleet/scripts`

  ##### Default response

  `Status: 200`

  ```json
  {
    "scripts": [
      {
        "id": 1,
        "team_id": null,
        "name": "script_1.sh",
        "created_at": "2023-07-30T13:41:07Z",
        "updated_at": "2023-07-30T13:41:07Z"
      },
      {
        "id": 2,
        "team_id": null,
        "name": "script_2.sh",
        "created_at": "2023-08-30T13:41:07Z",
        "updated_at": "2023-08-30T13:41:07Z"
      }
    ],
    "meta": {
      "has_next_results": false,
      "has_previous_results": false
    }
  }

  ```

  Reference: https://fleetdm.com/docs/rest-api/rest-api#list-scripts
