info:
  name: List Apple Business (AB) tokens
  type: http
  seq: 2
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/ab_tokens'
  auth: inherit
docs: |-
  _Available in Fleet Premium_

  `GET /api/v1/fleet/ab_tokens`

  #### Parameters

  None.

  #### Example

  `GET /api/v1/fleet/ab_tokens`

  ##### Default response

  `Status: 200`

