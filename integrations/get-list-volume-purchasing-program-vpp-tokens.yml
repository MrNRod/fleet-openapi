info:
  name: List Volume Purchasing Program (VPP) tokens
  type: http
  seq: 3
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/vpp_tokens'
  auth: inherit
docs: |-
  _Available in Fleet Premium_

  `GET /api/v1/fleet/vpp_tokens`

  #### Parameters

  None.

  #### Example

  `GET /api/v1/fleet/vpp_tokens`

  ##### Default response

  `Status: 200`

  ```json
  {
    "vpp_tokens": [
      {
        "id": 1,
        "org_name": "Fleet Device Management Inc.",
        "location": "https://example.com/mdm/apple/mdm",
        "country_code": "us",
        "renew_date": "2023-11-29T00:00:00Z",
        "teams": [
          {
            "name": "💻 Workstations",
            "team_id": 1
          },
          {
            "name": "💻🐣 Workstations (canary)",
            "team_id": 2
          },
          {
            "name": "📱🏢 Company-owned iPhones",
            "team_id": 3
          },
          {
            "name": "🔳🏢 Company-owned iPads",
            "team_id": 4
          }
        ],
        "fleets": [
          {
            "name": "💻 Workstations",
            "fleet_id": 1
          },
          {
            "name": "💻🐣 Workstations (canary)",
            "fleet_id": 2
          },
          {
            "name": "📱🏢 Company-owned iPhones",
            "fleet_id": 3
          },
          {
            "name": "🔳🏢 Company-owned iPads",
            "fleet_id": 4
          }
        ]
      }
    ]
  }
  ```

  Reference: https://fleetdm.com/docs/rest-api/rest-api#list-volume-purchasing-program-vpp-tokens
