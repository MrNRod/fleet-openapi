info:
  name: Get Android Enterprise
  type: http
  seq: 4
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/android_enterprise'
  auth: inherit
docs: |-
  Get info about Android Enterprise that's connected to Fleet.

  `GET /api/v1/fleet/android_enterprise`


  #### Parameters

  None.

  #### Example

  `GET /api/v1/fleet/android_enterprise`


  ##### Default response

  `Status: 200`

  ```json
  {
    "android_enterprise_id": "LC0445szuv"
  }
  ```

  Reference: https://fleetdm.com/docs/rest-api/rest-api#get-android-enterprise
examples:
- name: 200 Default response
  request:
    method: GET
    url: '{{baseUrl}}/api/v1/fleet/android_enterprise'
  response:
    status: 200
    statusText: OK
    body:
      type: json
      data: |-
        {
          "android_enterprise_id": "LC0445szuv"
        }
    headers:
    - name: Content-Type
      value: application/json
