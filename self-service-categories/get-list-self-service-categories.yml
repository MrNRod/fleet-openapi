info:
  name: List self-service categories
  type: http
  seq: 1
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/software/self_service_categories'
  auth: inherit
  params:
  - name: fleet_id
    value: ''
    type: query
    disabled: true
    description: '**Required**. The fleet ID. Use `0` to list categories for "Unassigned" hosts.'
docs: |-
  Lists all self-service categories on the specified fleet.

  `GET /api/v1/fleet/software/self_service_categories`

  #### Parameters

  | Name     | Type    | In    | Description                                                                                                       |
  | -------- | ------- | ----- | ----------------------------------------------------------------------------------------------------------------- |
  | fleet_id | integer | query | **Required**. The fleet ID. Use `0` to list categories for "Unassigned" hosts.                                    |

  #### Example

  `GET /api/v1/fleet/software/self_service_categories?fleet_id=3`

  ##### Default response

  `Status: 200`

  ```json
  {
    "self_service_categories": [
      {
        "id": 12,
        "name": "🌎 Browsers",
        "fleet_id": 3,
        "created_at": "2026-05-01T14:22:58Z",
        "updated_at": "2026-05-01T14:22:58Z"
      },
      {
        "id": 13,
        "name": "🧰 Developer tools",
        "fleet_id": 3,
        "created_at": "2026-05-01T14:22:58Z",
        "updated_at": "2026-05-01T14:22:58Z"
      }
    ]
  }
  ```

  Reference: https://fleetdm.com/docs/rest-api/rest-api#list-self-service-categories
