info:
  name: Get disk encryption status
  type: http
  seq: 15
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/disk_encryption'
  auth: inherit
  params:
  - name: fleet_id
    value: ''
    type: query
    disabled: true
    description: _Available in Fleet Premium_. The fleet ID to filter the summary.
docs: |-
  _Available in Fleet Premium_

  Get aggregate status counts of disk encryption enforced on macOS and Windows hosts.

  The summary can optionally be filtered by fleet ID.

  `GET /api/v1/fleet/disk_encryption`

  #### Parameters

  | Name                      | Type   | In    | Description                                                               |
  | ------------------------- | ------ | ----- | ------------------------------------------------------------------------- |
  | fleet_id                   | string | query | _Available in Fleet Premium_. The fleet ID to filter the summary.           |

  #### Example

  `GET /api/v1/fleet/disk_encryption`

  ##### Default response

  `Status: 200`

  ```json
  {
    "verified": {"macos": 123, "windows": 123, "linux": 13},
    "verifying": {"macos": 123, "windows": 0, "linux": 0},
    "action_required": {"macos": 123, "windows": 0, "linux": 37},
    "enforcing": {"macos": 123, "windows": 123, "linux": 0},
    "failed": {"macos": 123, "windows": 123, "linux": 0},
    "removing_enforcement": {"macos": 123, "windows": 0, "linux": 0}
  }
  ```

  Reference: https://fleetdm.com/docs/rest-api/rest-api#get-disk-encryption-status
