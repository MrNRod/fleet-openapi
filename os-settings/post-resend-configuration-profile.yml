info:
  name: Resend configuration profile
  type: http
  seq: 6
http:
  method: POST
  url: '{{baseUrl}}/api/v1/fleet/hosts/:id/configuration_profiles/:profile_uuid/resend'
  auth: inherit
  params:
  - name: id
    value: ''
    type: path
    description: '**Required.** The host''s ID.'
  - name: profile_uuid
    value: ''
    type: path
    description: '**Required.** The UUID of the configuration profile to resend to the host.'
docs: |-
  Resends a configuration profile for the specified host. Currently, macOS, iOS, iPadOS configuration profiles (.mobileconfig) are supported, as well as Windows (.xml) configuration profiles.

  `POST /api/v1/fleet/hosts/:id/configuration_profiles/:profile_uuid/resend`

  #### Parameters

  | Name | Type | In | Description |
  | ---- | ---- | -- | ----------- |
  | id   | integer | path | **Required.** The host's ID. |
  | profile_uuid   | string | path | **Required.** The UUID of the configuration profile to resend to the host. |

  #### Example

  `POST /api/v1/fleet/hosts/233/configuration_profiles/fc14a20-84a2-42d8-9257-a425f62bb54d/resend`

  ##### Default response

  `Status: 202`

  Reference: https://fleetdm.com/docs/rest-api/rest-api#resend-configuration-profile
