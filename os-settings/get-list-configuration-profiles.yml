info:
  name: List configuration profiles
  type: http
  seq: 2
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/configuration_profiles'
  auth: inherit
  params:
  - name: fleet_id
    value: ''
    type: query
    disabled: true
    description: _Available in Fleet Premium_. The fleet id to filter profiles.
  - name: page
    value: ''
    type: query
    disabled: true
    description: Page number of the results to fetch.
  - name: per_page
    value: ''
    type: query
    disabled: true
    description: Results per page.
  - name: order_key
    value: ''
    type: query
    disabled: true
    description: What to order results by. Can be ordered by `name`, `created_at`, or `uploaded_at`.
  - name: order_direction
    value: ''
    type: query
    disabled: true
    description: '**Requires `order_key`**. The direction of the order given the order key. Options include `"asc"`
      and `"desc"`. Default is `"asc"`.'
  - name: after
    value: ''
    type: query
    disabled: true
    description: The value to get results after. This needs `order_key` defined, as that's the column that would
      be used.
docs: |-
  > [List custom macOS settings](https://github.com/fleetdm/fleet/blob/fleet-v4.40.0/docs/REST%20API/rest-api.md#list-custom-macos-settings-configuration-profiles) (`GET /api/v1/fleet/mdm/apple/profiles`) API endpoint is deprecated as of Fleet 4.41. It is maintained for backwards compatibility. Please use the below API endpoint instead.

  Get a list of the configuration profiles in Fleet.

  For Fleet Premium, the list can
  optionally be filtered by fleet ID. If no fleet ID is specified, fleet profiles are excluded from the
  results (i.e., only profiles that are associated with "Unassigned" are listed).

  `GET /api/v1/fleet/configuration_profiles`

  #### Parameters

  | Name                      | Type   | In    | Description                                                               |
  | ------------------------- | ------ | ----- | ------------------------------------------------------------------------- |
  | fleet_id                   | string | query | _Available in Fleet Premium_. The fleet id to filter profiles.              |
  | page                      | integer | query | Page number of the results to fetch.                                     |
  | per_page                  | integer | query | Results per page.                                                        |
  | order_key                 | string  | query | What to order results by. Can be ordered by `name`, `created_at`, or `uploaded_at`. |
  | order_direction           | string  | query | **Requires `order_key`**. The direction of the order given the order key. Options include `"asc"` and `"desc"`. Default is `"asc"`. |
  | after                     | string  | query | The value to get results after. This needs `order_key` defined, as that's the column that would be used. |

  #### Example

  List all configuration profiles for macOS and Windows hosts enrolled to Fleet's MDM that are "Unassigned".

  `GET /api/v1/fleet/configuration_profiles`

  ##### Default response

  `Status: 200`

  ```json
  {
    "profiles": [
      {
        "profile_uuid": "39f6cbbc-fe7b-4adc-b7a9-542d1af89c63",
        "team_id": 0,
        "name": "Example macOS profile",
        "platform": "darwin",
        "identifier": "com.example.profile",
        "created_at": "2023-03-31T00:00:00Z",
        "updated_at": "2023-03-31T00:00:00Z",
        "checksum": "dGVzdAo=",
        "labels_exclude_any": [
         {
          "name": "Label name 1",
          "id": 1
         }
        ],
        "activation": "eyJldmVudCI6..."
      },
      {
        "profile_uuid": "f5ad01cc-f416-4b5f-88f3-a26da3b56a19",
        "team_id": 0,
        "name": "Example Windows profile",
        "platform": "windows",
        "created_at": "2023-04-31T00:00:00Z",
        "updated_at": "2023-04-31T00:00:00Z",
        "checksum": "aCLemVr)",
        "labels_include_all": [
          {
            "name": "Label name 2",
            "broken": true
          },
          {
            "name": "Label name 3",
            "id": 3
          }
        ]
      }
    ],
    "meta": {
      "has_next_results": false,
      "has_previous_results": false
    }
  }
  ```

  If one or more assigned labels are deleted the profile is considered broken (`broken: true`). It won’t be applied to new hosts.

  Reference: https://fleetdm.com/docs/rest-api/rest-api#list-configuration-profiles
