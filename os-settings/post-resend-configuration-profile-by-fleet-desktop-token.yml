info:
  name: Resend configuration profile by Fleet Desktop token
  type: http
  seq: 12
http:
  method: POST
  url: '{{baseUrl}}/api/v1/fleet/device/:token/configuration_profiles/:profile_uuid/resend'
  params:
  - name: token
    value: ''
    type: path
    description: '**Required.** The host''s [Fleet Desktop token](https://fleetdm.com/guides/fleet-desktop#secure-fleet-desktop).'
  - name: profile_uuid
    value: ''
    type: path
    description: '**Required.** The UUID of the configuration profile to resend to the host.'
docs: |-
  Resends a configuration profile for the specified host. Currently, macOS, iOS, iPadOS configuration profiles (.mobileconfig) are supported, as well as Windows (.xml) configuration profiles.

  `POST /api/v1/fleet/device/:token/configuration_profiles/:profile_uuid/resend`

  #### Parameters

  | Name | Type | In | Description |
  | ---- | ---- | -- | ----------- |
  | token   | string | path | **Required.** The host's [Fleet Desktop token](https://fleetdm.com/guides/fleet-desktop#secure-fleet-desktop). |
  | profile_uuid   | string | path | **Required.** The UUID of the configuration profile to resend to the host. |

  #### Example

  `POST /api/v1/fleet/device/abcdef012456789/configuration_profiles/fc14a20-84a2-42d8-9257-a425f62bb54d/resend`

  ##### Default response

  `Status: 202`

  Reference: https://fleetdm.com/docs/rest-api/rest-api#resend-configuration-profile-by-fleet-desktop-token
examples:
