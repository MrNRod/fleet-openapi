name: Validate Bruno collection

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test parser and generated YAML
        run: python -m unittest discover -s scripts -v
      - name: Check reproducibility against the pinned Fleet release
        run: python scripts/generate.py --check
