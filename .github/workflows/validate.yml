name: Validate Bruno collection

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --quiet --disable-pip-version-check -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s scripts -q
      - name: Check collection
        run: python scripts/generate.py --check
