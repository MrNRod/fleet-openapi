name: Update OpenCollection

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1-5' # Weekdays at 09:00 UTC.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Fleet release tag (e.g. fleet-v4.93.0); leave empty for latest'
        required: false
        type: string
      force:
        description: 'Regenerate even if the collection version already matches'
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-open-collection
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --quiet --disable-pip-version-check -r requirements.txt

      - name: Check Fleet release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request, yaml
          from pathlib import Path
          tag = os.environ.get('INPUT_TAG', '').strip()
          if not tag:
              request = urllib.request.Request(
                  'https://api.github.com/repos/fleetdm/fleet/releases/latest',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'User-Agent': 'fleet-opencollection-updater'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  tag = json.load(response)['tag_name']
          if not re.fullmatch(r'fleet-v\d+\.\d+\.\d+(?:[-.][A-Za-z0-9.-]+)?', tag):
              raise SystemExit('Invalid Fleet release tag')
          version = tag.removeprefix('fleet-v')
          current = yaml.safe_load(Path('opencollection.yml').read_text())['info']['version']
          update = version != current or os.environ.get('FORCE') == 'true'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in {'tag': tag, 'version': version, 'current': current,
                                 'update': str(update).lower()}.items():
                  output.write(f'{key}={value}\n')
          if not update:
              print(f'Already up to date: Fleet {current}')
          elif version == current:
              print(f'Regenerating Fleet {version}')
          else:
              print(f'Updating Fleet {current} → {version}')
          PY

      - name: Run tests
        if: steps.release.outputs.update == 'true'
        run: python -m unittest discover -s scripts -q

      - name: Generate collection
        if: steps.release.outputs.update == 'true'
        env:
          FLEET_TAG: ${{ steps.release.outputs.tag }}
        run: python scripts/generate.py --tag "$FLEET_TAG"

      - name: Validate collection
        if: steps.release.outputs.update == 'true'
        run: |
          python -m unittest discover -s scripts -q
          python scripts/generate.py --check

      - name: Open update PR
        id: pr
        if: steps.release.outputs.update == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-open-collection
          delete-branch: true
          commit-message: 'Update OpenCollection to Fleet v${{ steps.release.outputs.version }}'
          title: 'Update OpenCollection to Fleet v${{ steps.release.outputs.version }}'
          body: |
            Generated directly from Fleet's REST API Markdown at `${{ steps.release.outputs.tag }}`.

            Previous version: `${{ steps.release.outputs.current }}`.
            Target version: `${{ steps.release.outputs.version }}`.

            Review the YAML request changes and the embedded `extensions.fleet` metadata for counts, skipped sections, and parsing notes.
            Pull the changes into your clone or download the release bundle after merging.
          add-paths: |
            opencollection.yml
            :(glob)*/*.yml

      - name: Enable auto-merge
        if: success() && steps.pr.outputs.pull-request-number != '' && steps.pr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: |
          : "${PR_HEAD_SHA:?Missing PR head SHA}"
          gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$PR_HEAD_SHA"

  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Always publish the merged collection, independently of the update PR.
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --quiet --disable-pip-version-check -r requirements.txt
      - name: Validate collection
        run: |
          python -m unittest discover -s scripts -q
          python scripts/generate.py --check
      - name: Generate bundle
        run: python scripts/generate.py --bundle dist/fleet.opencollection.yml
      - name: Publish bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import hashlib, os, subprocess, yaml
          from pathlib import Path
          bundle = Path('dist/fleet.opencollection.yml')
          content = bundle.read_bytes()
          collection = yaml.safe_load(content)
          version = collection['info']['version']
          source = collection['extensions']['fleet']['source_ref']
          # A changed collection gets a new release; identical reruns reuse it.
          tag = f'fleet-v{version}-{hashlib.sha256(content).hexdigest()[:12]}'
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'RELEASE_TAG={tag}\nFLEET_VERSION={version}\nCOLLECTION_COMMIT={commit}\n')
          Path('dist/release-notes.md').write_text(
              f'Fleet REST API collection in OpenCollection format, generated from `{source}`.\n\n'
              f'Import `fleet.opencollection.yml` into a compatible API client, '
              f'or clone this repository for the directory layout.\n\n'
              f'Collection commit: `{commit}`. Licensed under CC BY-SA 4.0; attribution is included in the bundle.\n')
          PY
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [ "$draft" = false ]; then
              echo "Release already published: $RELEASE_TAG"
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --draft --target "$COLLECTION_COMMIT" \
              --title "Fleet v$FLEET_VERSION" --notes-file dist/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/fleet.opencollection.yml --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
