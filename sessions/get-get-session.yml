info:
  name: Get session
  type: http
  seq: 1
http:
  method: GET
  url: '{{baseUrl}}/api/v1/fleet/sessions/:id'
  auth: inherit
  params:
  - name: id
    value: ''
    type: path
    description: '**Required**. The ID of the desired session.'
docs: |-
  Returns the session information for the session specified by ID.

  `GET /api/v1/fleet/sessions/:id`

  #### Parameters

  | Name | Type    | In   | Description                                  |
  | ---- | ------- | ---- | -------------------------------------------- |
  | id   | integer | path | **Required**. The ID of the desired session. |

  #### Example

  `GET /api/v1/fleet/sessions/1`

  ##### Default response

  `Status: 200`

  ```json
  {
    "session_id": 1,
    "user_id": 1,
    "created_at": "2021-03-02T18:41:34Z"
  }
  ```

  Reference: https://fleetdm.com/docs/rest-api/rest-api#get-session
examples:
- name: 200 Default response
  request:
    method: GET
    url: '{{baseUrl}}/api/v1/fleet/sessions/:id'
    params:
    - name: id
      value: ''
      type: path
      description: '**Required**. The ID of the desired session.'
  response:
    status: 200
    statusText: OK
    body:
      type: json
      data: |-
        {
          "session_id": 1,
          "user_id": 1,
          "created_at": "2021-03-02T18:41:34Z"
        }
    headers:
    - name: Content-Type
      value: application/json
